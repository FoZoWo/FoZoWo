<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>軽量ZoJeZuブログ</title>
<style>
body{font-family:sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;color:#222;line-height:1.7}
a{color:#294a2d}
input{width:100%;padding:.5rem;margin:.5rem 0;box-sizing:border-box}
ul{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid #ddd;padding:.6rem 0}
li a{display:flex;gap:1rem;text-decoration:none}
time{color:#777;font-size:.8rem;white-space:nowrap}
mark{background:#fbe7a1}
.pg{display:flex;justify-content:center;gap:1rem;margin:1rem 0}
h1{font-size:1.4rem}
.err{color:#9a3b34}
</style>
</head>
<body>
<div id="app">読み込み中…</div>
<script>
const API='https://blog-api.oisasioisasi.workers.dev',PS=5;
let posts=[],page=1,q='',ym='';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const hl=(t,q)=>q?t.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`):t;
const fmt=d=>new Date(d).toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const ymOf=d=>{const t=new Date(d);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`};
const ymLabel=y=>{const[a,b]=y.split('-');return `${a}年${+b}月`};
const topLink='<p><a href="https://zojezu.f5.si/lite">← 軽量ホームページトップに戻る</a></p>';

async function init(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  try{
    const r=await fetch(API),d=await r.json();
    if(!d.success)throw new Error('取得失敗');
    posts=(d.posts||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    if(id)showPost(id);
    else if(params.get('archive'))showList(params.get('archive'));
    else showList();
  }catch(e){app.innerHTML=`<p class="err">エラー: ${esc(e.message)}</p>`}
}

function showList(preYm){
  ym=preYm||'';page=1;
  app.innerHTML=`<h1><a href="https://zojezu.f5.si/lite.blog">軽量ZoJeZuブログ</a></h1>
    ${topLink}
    <input id="s" placeholder="検索">
    <p><a href="javascript:void(0)" id="arlink">アーカイブ</a></p>
    <div id="l"></div>`;
  document.getElementById('s').oninput=e=>{q=e.target.value.trim();page=1;renderList()};
  document.getElementById('arlink').onclick=showArchive;
  renderList();
}

function showArchive(){
  const counts={};
  posts.forEach(p=>{const y=ymOf(p.created_at);counts[y]=(counts[y]||0)+1});
  const rows=Object.keys(counts).sort().reverse().map(y=>`<li><a href="?archive=${y}">${ymLabel(y)}（${counts[y]}）</a></li>`).join('');
  app.innerHTML=`<h1><a href="https://zojezu.f5.si/lite.blog">軽量ZoJeZuブログ</a></h1>${topLink}<p><a href="https://zojezu.f5.si/lite.blog">← 一覧に戻る</a></p><ul>${rows}</ul>`;
}

function renderList(){
  let f=q?posts.filter(p=>p.title.toLowerCase().includes(q.toLowerCase())||p.content.toLowerCase().includes(q.toLowerCase())):posts;
  if(ym)f=f.filter(p=>ymOf(p.created_at)===ym);
  const l=document.getElementById('l');
  const head=ym?`<p>${ymLabel(ym)}の記事 <a href="https://zojezu.f5.si/lite.blog">（全期間に戻る）</a></p>`:'';
  if(!f.length){l.innerHTML=head+'<p>記事が見つかりません</p>';return}
  const tp=Math.max(1,Math.ceil(f.length/PS));
  if(page>tp)page=tp;
  const s=(page-1)*PS;
  const rows=f.slice(s,s+PS).map(p=>`<li><a href="?id=${p.id}"><time>${fmt(p.created_at)}</time><span>${hl(esc(p.title),q)}</span></a></li>`).join('');
  l.innerHTML=`${head}<ul>${rows}</ul>${tp>1?`<div class="pg"><button id="pv" ${page===1?'disabled':''}>←</button>${page}/${tp}<button id="nx" ${page===tp?'disabled':''}>→</button></div>`:''}`;
  const pv=document.getElementById('pv'),nx=document.getElementById('nx');
  if(pv)pv.onclick=()=>{page--;renderList()};
  if(nx)nx.onclick=()=>{page++;renderList()};
}

function showPost(id){
  const p=posts.find(p=>String(p.id)===String(id));
  if(!p){app.innerHTML=`<a href="https://zojezu.f5.si/lite.blog">← 一覧</a><p>記事が見つかりません</p>`;return}
  document.title=p.title;
  const c=esc(p.content).replace(/\n/g,'<br>').replace(/^## (.*?)(<br>|$)/gm,'<h2>$1</h2>').replace(/^### (.*?)(<br>|$)/gm,'<h3>$1</h3>').replace(/^- (.*?)(<br>|$)/gm,'<li>$1</li>');
  app.innerHTML=`<a href="https://zojezu.f5.si/lite.blog">← 一覧</a>${topLink}<h1>${esc(p.title)}</h1><p><time>${fmt(p.created_at)}</time></p><div>${c}</div>`;
}

init();
</script>
</body>
</html>
