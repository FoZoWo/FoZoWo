  function deepFallback(lang){return data[lang]||data.ja}
  function setLang(lang,{updateUrl=true}={}){
    lang=normalize(lang)||'ja'; currentLang=lang;
    try{localStorage.setItem('FoZoWo-language',lang)}catch(e){}
    html.lang=lang==='zh-cn'?'zh-CN':lang==='zh-tw'?'zh-TW':lang;
    const t=deepFallback(lang);
    document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(t[k]!=null)el.textContent=t[k]});
    const list=document.getElementById('faqList');
    list.innerHTML=t.qs.map((q,i)=>`<details class="faq-item"><summary><span class="qdot">＋</span><span>${escapeHtml(q[0])}</span></summary><div class="answer">${escapeHtml(q[1])}</div></details>`).join('');
    if(updateUrl){const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}
    const home=document.getElementById('backHome'); if(home){const u=new URL('index.html',location.href);u.searchParams.set('lang',lang);home.href=u.href}
    rewriteHeaderLinks(lang);
  }
  function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function rewriteHeaderLinks(lang){
    const root=document.getElementById('external-header-container'); if(!root)return;
    root.querySelectorAll('a[href]').forEach(a=>{try{const u=new URL(a.getAttribute('href'),location.href);if(u.origin!==location.origin)return;if(!/^https?:$/.test(u.protocol))return; if(u.pathname.endsWith('.html')||u.pathname==='/' ){u.searchParams.set('lang',lang);a.href=u.toString()}}catch(e){}})
  }
  function applyTheme(pref){pref=['auto','dark','light'].includes(pref)?pref:'auto'; html.dataset.theme=pref; try{localStorage.setItem('FoZoWo-theme',pref)}catch(e){} const meta=document.getElementById('themeColorMeta'); if(meta)meta.content=pref==='light'?'#f3f0f8':'#0a0a12'}
  try{applyTheme(localStorage.getItem('FoZoWo-theme')||'auto')}catch(e){applyTheme('auto')}
  setLang(currentLang,{updateUrl:true});
  window.addEventListener('fozowo-language-change',e=>setLang(e.detail&&e.detail.lang,{updateUrl:true}));

  async function loadHeader(){
    const host=document.getElementById('external-header-container');
    try{
      const res=await fetch('header.html',{cache:'no-cache'}); if(!res.ok)throw new Error('HTTP '+res.status);
      const tpl=document.createElement('template'); tpl.innerHTML=await res.text(); const scripts=[...tpl.content.querySelectorAll('script')]; scripts.forEach(s=>s.remove()); host.appendChild(tpl.content);
      scripts.forEach(old=>{const s=document.createElement('script'); [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value)); s.textContent=old.textContent; host.appendChild(s)});
      rewriteHeaderLinks(currentLang);
      const langOptions=host.querySelector('#langOptions');
      if(langOptions){langOptions.addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(b)setLang(b.dataset.value)});}
      const themeOptions=host.querySelector('#themeOptions');
      if(themeOptions){themeOptions.addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(b)applyTheme(b.dataset.value)});}
      setLang(currentLang,{updateUrl:false});
    }catch(err){console.warn('header.html の読み込みに失敗しました:',err)}
  }
  loadHeader();
})();
</script>
