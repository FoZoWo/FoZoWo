<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォゾウォAI - 公式アシスタント</title>
  <!-- Zen Maru Gothic フォントの読み込み -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16AI.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32AI.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512AI.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180AI.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #6c5ce7;
      --primary-hover: #5b4bc4;
      --user-msg-bg: #6c5ce7;
      --user-msg-text: #ffffff;
      --ai-msg-bg: #eef2f5;
      --ai-msg-text: #222222;
      --border-color: #e0e0e0;
      --sidebar-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a24;
      --card-bg: #242432;
      --text-color: #e0e0e0;
      --primary-color: #8c7ae6;
      --primary-hover: #9c8cf6;
      --user-msg-bg: #8c7ae6;
      --user-msg-text: #ffffff;
      --ai-msg-bg: #2f2f42;
      --ai-msg-text: #f0f0f0;
      --border-color: #3a3a4e;
      --sidebar-bg: #20202c;
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="auto"] {
        --bg-color: #1a1a24;
        --card-bg: #242432;
        --text-color: #e0e0e0;
        --primary-color: #8c7ae6;
        --primary-hover: #9c8cf6;
        --user-msg-bg: #8c7ae6;
        --user-msg-text: #ffffff;
        --ai-msg-bg: #2f2f42;
        --ai-msg-text: #f0f0f0;
        --border-color: #3a3a4e;
        --sidebar-bg: #20202c;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* サイドバー */
    .sidebar {
      width: 280px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .btn-new-chat {
      width: 100%;
      padding: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 15px;
      transition: background 0.2s;
    }

    .btn-new-chat:hover {
      background-color: var(--primary-hover);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px;
      border-radius: 6px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      border-color: var(--primary-color);
    }

    /* メインエリア */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 15px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.85rem;
    }

    select, button {
      font-family: inherit;
    }

    select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    /* チャット表示領域 */
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      color: var(--user-msg-text);
      border-bottom-right-radius: 2px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--ai-msg-bg);
      color: var(--ai-msg-text);
      border-bottom-left-radius: 2px;
    }

    /* 入力エリア */
    .input-area {
      padding: 15px 20px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    textarea {
      flex: 1;
      height: 50px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary-color);
    }

    .icon-btn {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    /* トグルスイッチ */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary-color);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>

  <!-- サイドバー（履歴） -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">フォゾウォAI</span>
    </div>
    <button class="btn-new-chat" id="newChatBtn">+ 新しいチャット</button>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- メインコンテンツ -->
  <div class="main-container">
    <!-- ヘッダー・設定 -->
    <div class="header">
      <h2>フォゾウォAI</h2>
      <div class="controls">
        <div class="control-group">
          <label>テーマ:</label>
          <select id="themeSelect">
            <option value="auto">自動</option>
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </div>
        <div class="control-group">
          <label>音声読み上げ:</label>
          <input type="checkbox" id="ttsToggle">
        </div>
      </div>
    </div>

    <!-- チャットログ領域 -->
    <div class="chat-box" id="chatBox">
      <div class="message ai">こんにちは！フォゾウォ公式AIアシスタントです。SNSやホームページ、その他気になることについて気軽にお聞きください！</div>
    </div>

    <!-- 入力エリア -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="userInput" placeholder="メッセージを入力..."></textarea>
        <button class="icon-btn" id="voiceBtn" title="音声入力">🎤</button>
        <button class="icon-btn" id="sendBtn" title="送信">➔</button>
      </div>
      <div class="toggle-container">
        <label class="switch">
          <input type="checkbox" id="searchModeToggle">
          <span class="slider"></span>
        </label>
        <span>検索モード（Wikipedia情報を参照）</span>
      </div>
    </div>
  </div>

  <script>
    // ★ご自身の Cloudflare Worker の URL に書き換えてください
    const WORKER_URL = "https://your-worker-name.your-subdomain.workers.dev";

    // アプリケーション状態
    let conversationHistory = [];
    let chatSessions = JSON.parse(localStorage.getItem('fozowo_chats') || '[]');
    let currentSessionId = Date.now();

    // DOM要素
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');
    const themeSelect = document.getElementById('themeSelect');
    const ttsToggle = document.getElementById('ttsToggle');
    const searchModeToggle = document.getElementById('searchModeToggle');

    // テーマ設定の初期化
    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
    });

    // メッセージ追加表示
    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // AIへの送信処理
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });
      userInput.value = '';

      // ローディング表示
      const loadingDiv = document.createElement('div');
      loadingDiv.classList.add('message', 'ai');
      loadingDiv.textContent = '考え中...';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversationHistory,
            searchMode: searchModeToggle.checked
          })
        });

        const data = await response.json();
        chatBox.removeChild(loadingDiv);

        if (data.error) throw new Error(data.error);

        const aiReply = data.result;
        appendMessage('ai', aiReply);
        conversationHistory.push({ role: 'assistant', content: aiReply });

        // 音声読み上げ
        if (ttsToggle.checked && 'speechSynthesis' in window) {
          const uttr = new SpeechSynthesisUtterance(aiReply);
          uttr.lang = 'ja-JP';
          window.speechSynthesis.speak(uttr);
        }

        saveSession();

      } catch (err) {
        chatBox.removeChild(loadingDiv);
        appendMessage('ai', 'エラーが発生しました: ' + err.message);
      }
    }

    // チャット履歴の保存
    function saveSession() {
      if (conversationHistory.length === 0) return;
      const title = conversationHistory[0].content.substring(0, 15) + '...';
      const existingIdx = chatSessions.findIndex(s => s.id === currentSessionId);
      
      if (existingIdx >= 0) {
        chatSessions[existingIdx].history = conversationHistory;
      } else {
        chatSessions.unshift({ id: currentSessionId, title, history: conversationHistory });
      }
      
      localStorage.setItem('fozowo_chats', JSON.stringify(chatSessions));
      renderHistory();
    }

    // 履歴リストの描画
    function renderHistory() {
      historyList.innerHTML = '';
      chatSessions.forEach(session => {
        const item = document.createElement('div');
        item.classList.add('history-item');
        item.textContent = session.title;
        item.onclick = () => loadSession(session.id);
        historyList.appendChild(item);
      });
    }

    // セッション読み込み
    function loadSession(id) {
      const session = chatSessions.find(s => s.id === id);
      if (!session) return;
      currentSessionId = session.id;
      conversationHistory = [...session.history];
      chatBox.innerHTML = '';
      conversationHistory.forEach(msg => {
        appendMessage(msg.role === 'assistant' ? 'ai' : 'user', msg.content);
      });
    }

    // 新規チャット作成
    newChatBtn.addEventListener('click', () => {
      currentSessionId = Date.now();
      conversationHistory = [];
      chatBox.innerHTML = '<div class="message ai">こんにちは！フォゾウォ公式AIアシスタントです。SNSやホームページ、その他気になることについて気軽にお聞きください！</div>';
    });

    // イベントリスナー設定
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 音声入力 (Web Speech API)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';

      recognition.onresult = (e) => {
        userInput.value = e.results[0][0].transcript;
      };

      voiceBtn.addEventListener('click', () => {
        recognition.start();
      });
    } else {
      voiceBtn.style.display = 'none';
    }

    // 初期化描画
    renderHistory();
  </script>
</body>
</html>
