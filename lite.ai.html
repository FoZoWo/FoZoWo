<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZoJeZuAI軽量版</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;font-size:15px;line-height:1.5;color:#222;background:#fff;height:100dvh;display:flex;flex-direction:column}header{padding:12px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px;flex-shrink:0}header a{color:#06c;text-decoration:none;font-size:14px}header h1{font-size:1.1rem}#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:90%}.msg.user{align-self:flex-end}.msg.ai,.msg.error{align-self:flex-start}.msg .bubble{padding:10px 14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}.msg.user .bubble{background:#eee}.msg.ai .bubble{padding:4px 0}.msg.error .bubble{background:#fee;border:1px solid #fcc;color:#a33;font-size:13px}.msg a{color:#06c}.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;flex-shrink:0}.bar input{flex:1;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit}.bar input:focus{outline:none;border-color:#06c}.bar button{padding:10px 16px;border:none;border-radius:8px;background:#06c;color:#fff;font-size:14px;font-family:inherit;cursor:pointer}.bar button:disabled{opacity:.5;cursor:not-allowed}.hint{text-align:center;font-size:11px;color:#999;padding:0 16px 6px}</style>
<style id="ai-use-restriction-style">
#ai-use-restriction{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:99999;width:min(92vw,680px);padding:12px 16px;border:1px solid rgba(255,145,82,.38);border-radius:16px;background:rgba(20,24,30,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 35px rgba(0,0,0,.28);color:#fff;text-align:center;font:700 13px/1.55 system-ui,sans-serif;letter-spacing:.01em}
#ai-use-restriction[hidden]{display:none!important}
#ai-use-restriction strong{display:block;font-size:14px;margin-bottom:2px}
#ai-use-restriction .ai-restriction-time{opacity:.82;font-weight:600;font-size:12px}
[data-theme="light"] #ai-use-restriction{background:rgba(255,255,255,.96);color:#222;border-color:rgba(200,110,40,.25);box-shadow:0 12px 35px rgba(0,0,0,.12)}
@media(max-width:600px){#ai-use-restriction{top:70px;width:calc(100vw - 20px);padding:10px 12px;font-size:12px}.ai-restriction-time{font-size:11px!important}}
</style>

</head><body>
<div id="ai-use-restriction" hidden aria-live="polite">
  <strong id="ai-use-restriction-title">AI利用を一時制限中</strong>
  <span id="ai-use-restriction-text">ブログAIの自動投稿準備のため、8:45〜9:30（日本時間）はAIを利用できません。</span>
  <span class="ai-restriction-time" id="ai-use-restriction-time"></span>
</div>

<script id="ai-use-restriction-script">
(function(){
  const startMin=8*60+45;
  const endMin=9*60+30;
  const notice=document.getElementById('ai-use-restriction');
  const title=document.getElementById('ai-use-restriction-title');
  const text=document.getElementById('ai-use-restriction-text');
  const time=document.getElementById('ai-use-restriction-time');
  function jst(){
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false,hourCycle:'h23'}).formatToParts(new Date());
    const h=Number((parts.find(p=>p.type==='hour')||{}).value||0);
    const m=Number((parts.find(p=>p.type==='minute')||{}).value||0);
    return h*60+m;
  }
  function restricted(){
    const m=jst();
    return m>=startMin && m<endMin;
  }
  function update(){
    const locked=restricted();
    const en=(document.documentElement.lang||'ja').toLowerCase().startsWith('en');
    if(notice){
      notice.hidden=!locked;
      if(locked){
        title.textContent=en?'AI use temporarily limited':'AI利用を一時制限中';
        text.textContent=en
          ?'AI use is paused from 8:45 to 9:30 JST for the daily blog AI run.'
          :'ブログAIの自動投稿準備のため、8:45〜9:30（日本時間）はAIを利用できません。';
        const remain=Math.max(0,endMin-jst());
        const rm=Math.floor(remain/60), rs=remain%60;
        time.textContent=en
          ?`Resumes at 09:30 JST (about ${rm}m ${String(rs).padStart(2,'0')}s remaining)`
          :`9:30（日本時間）に再開します（あと${rm}分${String(rs).padStart(2,'0')}秒）`;
      }else{
        time.textContent='';
      }
    }
    document.dispatchEvent(new CustomEvent('ai-use-restriction-change',{detail:{restricted:locked}}));
  }
  window.__isAIUseRestricted=restricted;
  window.__updateAIUseRestriction=update;
  update();
  setInterval(update,1000);
  document.addEventListener('languagechange',update);
})();
</script>
<header><a href="lite.html">← ホーム</a><h1>FoZoWoAI軽量版</h1></header><div id="messages"></div><p class="hint">※ AIの自動応答です。誤りを含む場合があります。</p><div class="bar"><input type="text" id="input" placeholder="メッセージを入力" autocomplete="off"><button type="button" id="send">送信</button></div><script>(function(){
const API="https://oijii-majo-api.oisasioisasi.workers.dev";
const SYSTEM=`あなたは「FoZoWoAI」という、FoZoWo公式サイトのAIアシスタントです。
・丁寧で親しみやすい、自然な日本語（敬体）で簡潔に答えてください。特定のキャラクター口調や方言は使わないでください。

・おいじぃ魔女は、雑学動画を作るキャラクター　詳しくはおいじぃ魔女雑学SNS
・FoZoWo関連のSNSやサイトについて聞かれたら、以下の情報をもとに正確に案内してください。
・おいじぃ魔女のSNS
  https://www.instagram.com/oijiiw （Instagram）
  https://www.youtube.com/@oijiiw （YouTube）
  https://www.facebook.com/oijiiw （Facebook）
  https://x.com/oijiiw （X）
  https://www.tiktok.com/@oijiiw （TikTok）
  おいじぃ魔女のホームページ： https://www.fozowo.f5.si/oijiiw
・おいじぃ魔女雑学のSNS
  https://www.instagram.com/oijiizatu （Instagram）
  https://www.youtube.com/@oijiizatu （YouTube）
  https://www.facebook.com/oijiizatu （Facebook）
  https://x.com/oijiizatu （X）
  https://www.tiktok.com/@oijiizatu （TikTok）
  雑学ホームページ： https://www.fozowo.f5.si/oijiizatu
・FoZoWoのSNS
  https://www.youtube.com/@fozowo （YouTube）
  https://www.facebook.com/fozowo （Facebook）
  https://x.com/fozowo （X）
  https://www.tiktok.com/@fozowo （TikTok）
・FoZoWoAI（このチャット自身）のSNSについて聞かれた場合、または「@fozowoai」と指定された場合のみ、以下を案内してください（それ以外では案内しない）。
  FoZoWoAIのSNS（@fozowoai）
  https://www.instagram.com/fozowoai （Instagram）
  https://www.facebook.com/fozowoai （Facebook）
  https://www.youtube.com/@fozowoai （YouTube）
・FoZoWo公式ホームページ： https://www.fozowo.f5.si`;
let msgs=[{role:"system",content:SYSTEM}];
let busy=false;
const box=document.getElementById("messages");
const input=document.getElementById("input");
const btn=document.getElementById("send");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function linkify(s){return s.replace(/(https?:\/\/[^\s\(\)\<\>]+)/g,function(u){const c=u.replace(/[\.\,\;\:]$/,"");return'<a href="'+c+'" target="_blank" rel="noopener noreferrer">'+c+"</a>"})}
function add(text,type){
const d=document.createElement("div");
d.className="msg "+type;
const b=document.createElement("div");
b.className="bubble";
if(type==="ai"||type==="error")b.innerHTML=linkify(esc(text||""));
else b.textContent=text||"";
d.appendChild(b);
box.appendChild(d);
box.scrollTop=box.scrollHeight;
}
async function send(){
if(window.__isAIUseRestricted&&window.__isAIUseRestricted()){add("ブログAIの自動投稿準備のため、9:30までAIを利用できません。","error");return;}
const t=(input.value||"").trim();
if(!t||busy)return;
input.value="";
add(t,"user");
msgs.push({role:"user",content:t});
busy=true;btn.disabled=true;input.disabled=true;
const loading=document.createElement("div");
loading.className="msg ai";loading.id="ld";
loading.innerHTML='<div class="bubble">考え中…</div>';
box.appendChild(loading);box.scrollTop=box.scrollHeight;
try{
const now=new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"long",day:"numeric",weekday:"long",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const api=msgs.map((m,i)=>i===0&&m.role==="system"?{role:"system",content:m.content+"\n\n【現在の日時（日本時間）】"+now+"\n質問に「今何時」「今日の日付」「何年」などが含まれたら、この日時を正確に使って答えてください。"}:{role:m.role,content:m.content});
const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:api})});
const data=await res.json();
if(!res.ok)throw new Error("[HTTP "+res.status+"] "+(data.error||res.statusText));
const reply=data.choices[0].message.content;
msgs.push({role:"assistant",content:reply});
document.getElementById("ld")?.remove();
add(reply,"ai");
}catch(e){
document.getElementById("ld")?.remove();
add("通信エラーが発生しました。\n"+e.message,"error");
msgs.pop();
}finally{
busy=false;btn.disabled=false;input.disabled=false;input.focus();
}
}
document.addEventListener("ai-use-restriction-change",e=>{const locked=!!e.detail?.restricted;input.disabled=locked;btn.disabled=locked;});
input.disabled=!!(window.__isAIUseRestricted&&window.__isAIUseRestricted());
btn.disabled=!!(window.__isAIUseRestricted&&window.__isAIUseRestricted());
btn.addEventListener("click",send);
input.addEventListener("keypress",e=>{if(e.key==="Enter")send()});
input.focus();
})();</script></body></html>
