     FoZoWo Official — Shared Header

<style>
:root {
  --header-h: 68px;
  --nav-max: 1180px;
}
.network-toast {
  position: fixed; top: 14px; left: 50%;
  transform: translate(-50%, -140%);
  display: flex; align-items: center; gap: 10px;
  padding: 11px 18px; border-radius: 999px;
  background: var(--menu-bg, var(--panel, rgba(6,5,15,0.96)));
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
  color: var(--text, #f3f0ff); font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow, 0 22px 60px rgba(0,0,0,0.6)); z-index: 200;
  opacity: 0; transition: transform .4s cubic-bezier(.4,0,.2,1), opacity .4s;
  pointer-events: none; max-width: calc(100vw - 24px);
}
.network-toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.network-toast svg { width: 18px; height: 18px; flex: 0 0 auto; }
.network-toast.offline { border-color: rgba(255,107,203,0.6); }
.network-toast.offline svg { color: var(--pink, #ff5fa8); }
.network-toast.online { border-color: rgba(102,240,255,0.6); }
.network-toast.online svg { color: var(--cyan, #57e8ff); }

.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--header-bg, color-mix(in srgb, var(--panel, #120e22) 85%, transparent));
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border-bottom: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  z-index: 100;
  transition: background .3s ease, border-color .3s ease;
}
.header.scrolled {
  background: var(--header-bg-scrolled, var(--panel, #120e22));
  border-bottom-color: var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
}
.header-inner {
  max-width: var(--nav-max); height: 100%; margin: 0 auto;
  padding: 0 clamp(14px, 3vw, 28px);
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
}
.logo {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; color: var(--text, #f3f0ff);
  padding: 6px 10px; border-radius: 14px;
  transition: transform .25s;
}
.logo:hover { transform: translateY(-1px); }
.logo-img {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1.5px solid var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
  box-shadow: 0 0 16px rgba(139,108,255,0.5);
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  object-fit: cover;
}
.logo-text {
  font-family: 'Cinzel', serif;
  font-weight: 900; font-size: 17px; letter-spacing: 3px;
  background: linear-gradient(120deg, var(--pink, #ff5fa8) 0%, var(--violet, var(--purple, #8b6cff)) 40%, var(--cyan, #57e8ff) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-transform: uppercase;
}
.logo-text span { font-family: 'Zen Maru Gothic', sans-serif; letter-spacing: 0.5px; }

.nav-desktop { display: none; gap: 4px; }
.nav-desktop a {
  color: var(--text, #f3f0ff); text-decoration: none;
  font-size: 14px; font-weight: 600;
  padding: 8px 14px; border-radius: 12px;
  transition: background .2s, color .2s;
  white-space: nowrap;
}
.nav-desktop a:hover { background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09))); color: var(--pink, #ff5fa8); }
.nav-desktop a.accent {
  background: linear-gradient(120deg, var(--pink, #ff5fa8) 0%, var(--violet, var(--purple, #8b6cff)) 40%, var(--cyan, #57e8ff) 100%);
  color: #fff;
  box-shadow: 0 4px 18px rgba(139,108,255,0.5);
}
.nav-desktop a.accent:hover { transform: translateY(-1px); }

.header-actions { display: flex; align-items: center; gap: 6px; }
.share-panel {
  position: fixed; top: calc(var(--header-h) + 10px); right: clamp(10px, 3vw, 22px);
  width: min(420px, calc(100vw - 20px)); padding: 18px;
  background: var(--menu-bg, var(--panel, rgba(6,5,15,.97)));
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--border-strong, var(--line-strong, rgba(178,150,255,.4)));
  border-radius: var(--radius, 20px); box-shadow: var(--shadow, 0 22px 60px rgba(0,0,0,.6)), 0 0 40px rgba(139,108,255,.25);
  transform: translateY(-8px) scale(.98); opacity: 0; pointer-events: none;
  transition: transform .28s, opacity .28s; z-index: 95;
}
.share-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.share-title { display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:800; margin-bottom:14px; }
.share-close { width:30px; height:30px; border-radius:8px; border:1px solid var(--border, var(--line, rgba(178,150,255,.16))); background:var(--surface, var(--glass, rgba(255,255,255,.04))); color:var(--text,#f3f0ff); cursor:pointer; }
.share-grid { display:grid; grid-template-columns: 120px 1fr; gap:16px; align-items:center; }
.share-qr { width:120px; height:120px; object-fit:contain; border-radius:14px; background:#fff; padding:8px; border:1px solid var(--border-strong, rgba(178,150,255,.4)); }
.share-links { display:grid; gap:8px; }
.share-url { padding:10px 12px; border:1px solid var(--border, var(--line, rgba(178,150,255,.16))); border-radius:12px; background:var(--surface, var(--glass, rgba(255,255,255,.04))); }
.share-url small { display:block; color:var(--muted,#9d97c6); font-size:11px; margin-bottom:3px; }
.share-url strong { display:block; font-size:13px; overflow-wrap:anywhere; }
.share-actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }
.share-actions button { padding:10px 9px; border-radius:11px; border:1px solid var(--border, var(--line, rgba(178,150,255,.16))); background:var(--surface, var(--glass, rgba(255,255,255,.04))); color:var(--text,#f3f0ff); font:inherit; font-weight:700; cursor:pointer; }
.share-actions button.primary { background:linear-gradient(120deg,var(--pink,#ff5fa8),var(--violet,#8b6cff),var(--cyan,#57e8ff)); border-color:transparent; color:#fff; }
.share-actions button:hover { transform:translateY(-1px); background:var(--surface-hover, var(--glass-2, rgba(255,255,255,.09))); }
.share-download {
  display:flex; align-items:center; justify-content:center; padding:10px 9px; border-radius:11px;
  border:1px solid var(--border, var(--line, rgba(178,150,255,.16)));
  background:var(--surface, var(--glass, rgba(255,255,255,.04)));
  color:var(--text,#f3f0ff); text-decoration:none; font:inherit; font-weight:700;
  transition:transform .2s, background .2s, border-color .2s;
}
.share-download:hover { transform:translateY(-1px); background:var(--surface-hover, var(--glass-2, rgba(255,255,255,.09))); border-color:var(--border-strong, rgba(178,150,255,.4)); }
.share-status { min-height:1.4em; margin-top:9px; text-align:center; color:var(--muted,#9d97c6); font-size:12px; }
@media (max-width:560px){ .share-grid { grid-template-columns:1fr; } .share-qr { width:150px; height:150px; justify-self:center; } .share-actions { grid-template-columns:1fr; } }
.header-language {
  display:flex; align-items:center; gap:2px; padding:3px;
  border:1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  border-radius:999px; background:var(--surface, var(--glass, rgba(255,255,255,0.04)));
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.header-language button {
  min-width:36px; height:30px; padding:0 8px; border:0; border-radius:999px;
  background:transparent; color:var(--muted, #9d97c6); font:800 10px/1 inherit;
  letter-spacing:.04em; cursor:pointer; transition:background .2s, color .2s, transform .2s;
}
.header-language button:hover { background:var(--surface-hover, var(--glass-2, rgba(255,255,255,.09))); color:var(--text, #f3f0ff); }
.header-language button.active {
  background:linear-gradient(120deg, var(--pink,#ff5fa8), var(--violet,var(--purple,#8b6cff)));
  color:#fff; box-shadow:0 4px 12px rgba(139,108,255,.35);
}
@media (max-width:560px){ .header-language button{min-width:32px;height:29px;padding:0 7px} }
.settings-options#langOptions{grid-template-columns:repeat(2,1fr);max-height:260px;overflow:auto;}
.icon-btn, .hamburger {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  border: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  color: var(--text, #f3f0ff); display: grid; place-items: center;
  transition: background .2s, transform .2s, border-color .2s;
  cursor: pointer;
}
.icon-btn:hover, .hamburger:hover {
  background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09)));
  border-color: var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
  transform: translateY(-1px);
}
.icon-btn svg { width: 20px; height: 20px; }
.hamburger { position: relative; }
.hamburger span {
  position: absolute; left: 11px; width: 20px; height: 2px;
  background: currentColor; border-radius: 2px; transition: transform .3s, opacity .3s, top .3s;
}
.hamburger span:nth-child(1) { top: 14px; }
.hamburger span:nth-child(2) { top: 20px; }
.hamburger span:nth-child(3) { top: 26px; }
.hamburger.active span:nth-child(1) { top: 20px; transform: rotate(45deg); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { top: 20px; transform: rotate(-45deg); }

@media (min-width: 900px) {
  .nav-desktop { display: flex; }
  .hamburger { display: none; }
}

.settings-panel {
  position: fixed; top: calc(var(--header-h) + 10px);
  right: clamp(10px, 3vw, 22px);
  width: min(320px, calc(100vw - 20px));
  background: var(--menu-bg, var(--panel, rgba(6,5,15,0.96)));
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
  border-radius: var(--radius, 20px);
  padding: 18px;
  box-shadow: var(--shadow, 0 22px 60px rgba(0,0,0,0.6)), 0 0 40px rgba(139,108,255,0.25);
  transform: translateY(-8px); opacity: 0; pointer-events: none;
  transition: transform .28s, opacity .28s;
  z-index: 90;
}
.settings-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.settings-title {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; font-size: 15px; margin-bottom: 14px;
  font-family: 'Cinzel', serif; letter-spacing: 2px;
  color: var(--text, #f3f0ff);
}
.settings-close {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  border: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  color: var(--text, #f3f0ff); font-size: 20px; line-height: 1;
  cursor: pointer;
}
.settings-close:hover { background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09))); }
.settings-group { margin-bottom: 14px; }
.settings-group:last-child { margin-bottom: 0; }
.settings-label {
  display: block; font-size: 12px; color: var(--muted, #9d97c6);
  margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
}
.settings-options {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  border-radius: 12px; padding: 4px;
}
.settings-options button {
  padding: 8px 6px; border: none; background: transparent;
  color: var(--text, #f3f0ff); border-radius: 9px;
  font-size: 13px; font-weight: 600; font-family: inherit;
  transition: background .2s, color .2s; cursor: pointer;
}
.settings-options button:hover { background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09))); }
.settings-options button.active {
  background: linear-gradient(120deg, var(--pink, #ff5fa8), var(--violet, var(--purple, #8b6cff)));
  color: #fff; box-shadow: 0 2px 10px rgba(139,108,255,0.4);
}

.search-panel {
  position: fixed; top: calc(var(--header-h) + 10px);
  right: clamp(10px, 3vw, 22px);
  width: min(360px, calc(100vw - 20px));
  background: var(--menu-bg, var(--panel, rgba(6,5,15,0.96)));
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
  border-radius: var(--radius, 20px);
  padding: 14px;
  box-shadow: var(--shadow, 0 22px 60px rgba(0,0,0,0.6)), 0 0 40px rgba(139,108,255,0.25);
  transform: translateY(-8px); opacity: 0; pointer-events: none;
  transition: transform .28s, opacity .28s;
  z-index: 91;
}
.search-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.search-input-wrap {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  border: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  border-radius: 12px; padding: 10px 12px;
}
.search-input-wrap:focus-within {
  border-color: var(--border-strong, var(--line-strong, rgba(178,150,255,0.4)));
}
.search-input-wrap svg {
  width: 18px; height: 18px; flex: 0 0 auto;
  color: var(--muted, #9d97c6);
}
.search-input-wrap input {
  flex: 1; min-width: 0; background: transparent; border: none; outline: none;
  color: var(--text, #f3f0ff); font-size: 14px; font-family: inherit; font-weight: 600;
}
.search-input-wrap input::placeholder { color: var(--muted, #9d97c6); font-weight: 500; }
.search-clear {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09)));
  border: none; color: var(--text, #f3f0ff); font-size: 14px; line-height: 1;
  cursor: pointer; display: grid; place-items: center;
}
.search-clear:hover { background: var(--surface-hover-strong, rgba(255,255,255,0.16)); }
.search-results { margin-top: 10px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.search-result {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px;
  color: var(--text, #f3f0ff); text-decoration: none; font-weight: 600; font-size: 14px;
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  border: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  transition: background .2s, transform .2s;
}
.search-result:hover, .search-result:active {
  background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09)));
  color: var(--pink, #ff5fa8);
  transform: translateX(2px);
}
.search-result .icon { font-size: 17px; flex: 0 0 auto; }
.search-empty {
  padding: 16px 6px; text-align: center;
  color: var(--muted, #9d97c6); font-size: 13px; font-weight: 600;
}

.nav-mobile {
  position: fixed; top: var(--header-h); left: 0; right: 0;
  background: var(--menu-bg, var(--panel, rgba(6,5,15,0.96)));
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border-bottom: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  padding: 16px clamp(14px, 4vw, 24px) 22px;
  transform: translateY(-110%); opacity: 0; pointer-events: none;
  transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .3s;
  z-index: 85; max-height: calc(100dvh - var(--header-h)); overflow-y: auto;
}
.nav-mobile.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
.nav-mobile a {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; margin: 4px 0;
  color: var(--text, #f3f0ff); text-decoration: none; font-weight: 600;
  border-radius: 14px;
  background: var(--surface, var(--glass, rgba(255,255,255,0.04)));
  border: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  transition: background .2s, transform .2s;
}
.nav-mobile a:hover, .nav-mobile a:active {
  background: var(--surface-hover, var(--glass-2, rgba(255,255,255,0.09)));
  transform: translateX(4px);
}
.nav-mobile a .icon { font-size: 20px; }
.nav-mobile-footer {
  text-align: center; margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--border, var(--line, rgba(178,150,255,0.16)));
  color: var(--muted, #9d97c6); font-size: 12px;
  letter-spacing: 2px; font-family: 'Cinzel', serif;
}
</style>

    var SHARE_FULL_URL = window.location.href.split('#')[0];
    var SHARE_SHORT_URL = 'https://fzw.f5.si';
    function shareLang(ja,en){ return currentPageLang === 'en' ? en : ja; }
    function shareMessage(msg){ if(shareStatus) shareStatus.textContent=msg||''; }
    async function copyText(text, successKey){
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); }
        else { var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
        shareMessage(successKey);
      } catch(e){ shareMessage(shareLang('コピーできませんでした','Copy failed')); }
    }
    if (shareFullUrlText) shareFullUrlText.textContent = SHARE_FULL_URL;
    if (shareBtn && sharePanel) {
      shareBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var open=!sharePanel.classList.contains('open');
        closeAll();
        if(open){ sharePanel.classList.add('open'); shareBtn.setAttribute('aria-expanded','true'); shareMessage(''); }
      });
    }
    if (shareClose) shareClose.addEventListener('click', function(){ sharePanel.classList.remove('open'); if(shareBtn) shareBtn.setAttribute('aria-expanded','false'); });
    if (nativeShareBtn) nativeShareBtn.addEventListener('click', async function(){
      if (navigator.share) {
        try { var shareText = (currentPageLang==='en') ? 'FoZoWo official homepage' : 'FoZoWo（フォゾウォ）公式ホームページ'; await navigator.share({title:'FoZoWo', text:shareText, url:SHARE_FULL_URL}); shareMessage(''); }
        catch(e){ if(e && e.name!=='AbortError') shareMessage(shareLang('共有を開始できませんでした','Could not start sharing')); }
      } else { await copyText(SHARE_SHORT_URL,currentPageLang==='en'?'Short URL copied':'短縮URLをコピーしました'); }
    });
    if (copyShortBtn) copyShortBtn.addEventListener('click', function(){ copyText(SHARE_SHORT_URL,currentPageLang==='en'?'Short URL copied':'短縮URLをコピーしました'); });
    if (copyFullBtn) copyFullBtn.addEventListener('click', function(){ copyText(SHARE_FULL_URL,currentPageLang==='en'?'Official URL copied':'公式URLをコピーしました'); });

    // ===== 検索 =====
    function openSearch() {
      if (!searchPanel) return;
      searchPanel.classList.add('open');
      if (searchBtn) searchBtn.setAttribute('aria-expanded', 'true');
      window.setTimeout(function () { if (searchInput) searchInput.focus(); }, 60);
    }
    function closeSearch() {
      if (!searchPanel) return;
      searchPanel.classList.remove('open');
      if (searchBtn) searchBtn.setAttribute('aria-expanded', 'false');
    }
    window.closeFoZoWoSearch = closeSearch;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderSearch(query) {
      if (!searchResults) return;
      var q = query.trim().toLowerCase();
      if (searchClear) searchClear.hidden = q.length === 0;
      if (!q) {
        searchResults.innerHTML = '<div class="search-empty">キーワードを入力してください</div>';
        return;
      }
      var matches = FoZoWo_SEARCH_INDEX.filter(function (item) {
        return item.title.toLowerCase().indexOf(q) !== -1 ||
               item.keywords.toLowerCase().indexOf(q) !== -1;
      });
      if (matches.length === 0) {
        searchResults.innerHTML = '<div class="search-empty">見つかりませんでした</div>';
        return;
      }
      searchResults.innerHTML = matches.map(function (item) {
        return '<a class="search-result" href="' + item.url + '">' +
                 '<span class="icon">' + item.icon + '</span>' +
                 '<span class="label">' + escapeHtml(item.title) + '</span>' +
               '</a>';
      }).join('');
    }

    if (searchBtn) {
      searchBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (searchPanel && searchPanel.classList.contains('open')) {
          closeSearch();
        } else {
          closeAll();
          openSearch();
        }
      });
    }
    if (searchInput) {
      searchInput.addEventListener('input', function () { renderSearch(this.value); });
    }
    if (searchClear) {
      searchClear.addEventListener('click', function () {
        if (searchInput) {
          searchInput.value = '';
          renderSearch('');
          searchInput.focus();
        }
      });
    }
    if (searchResults) {
      searchResults.addEventListener('click', function (e) {
        if (e.target.closest('a')) closeSearch();
      });
    }

    // ===== 外側クリックで閉じる =====
    document.addEventListener('click', function (e) {
      if (sharePanel && sharePanel.classList.contains('open') &&
          !sharePanel.contains(e.target) && e.target !== shareBtn && !(shareBtn && shareBtn.contains(e.target))) {
        sharePanel.classList.remove('open');
        if (shareBtn) shareBtn.setAttribute('aria-expanded', 'false');
      }
      if (settingsPanel && settingsPanel.classList.contains('open') &&
          !settingsPanel.contains(e.target) && e.target !== settingsBtn && !(settingsBtn && settingsBtn.contains(e.target))) {
        settingsPanel.classList.remove('open');
      }
      if (searchPanel && searchPanel.classList.contains('open') &&
          !searchPanel.contains(e.target) && e.target !== searchBtn && !(searchBtn && searchBtn.contains(e.target))) {
        closeSearch();
      }
      if (navMobile && navMobile.classList.contains('open') &&
          !navMobile.contains(e.target) && e.target !== hamburger && !(hamburger && hamburger.contains(e.target))) {
        closeAll();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeAll();
    });

    // ===== スクロールでヘッダー変化 =====
    if (header) {
      window.addEventListener('scroll', function () {
        header.classList.toggle('scrolled', window.scrollY > 8);
      }, { passive: true });
    }

    // ===== ネットワークトースト =====
    function showNetworkToast(online) {
      if (!networkToast) return;
      networkToast.classList.remove('online', 'offline', 'show');
      networkToast.classList.add(online ? 'online' : 'offline');
      if (networkToastText) { var msg = online ? {ja:'オンラインに戻りました',en:'Back online',hiragana:'おんらいんにもどりました',ko:'온라인으로 돌아왔습니다','zh-cn':'已恢复在线','zh-tw':'已恢復上線',es:'De nuevo en línea',fr:'De nouveau en ligne',de:'Wieder online',pt:'Online novamente'} : {ja:'オフラインです',en:'You are offline',hiragana:'おふらいんです',ko:'오프라인입니다','zh-cn':'当前处于离线状态','zh-tw':'目前為離線狀態',es:'Estás sin conexión',fr:'Vous êtes hors ligne',de:'Du bist offline',pt:'Você está offline'}; networkToastText.textContent = msg[currentPageLang] || msg.ja; }
      networkToast.classList.add('show');
      window.clearTimeout(showNetworkToast._t);
      showNetworkToast._t = window.setTimeout(function () {
        networkToast.classList.remove('show');
      }, 2800);
    }
    window.addEventListener('online', function () { showNetworkToast(true); });
    window.addEventListener('offline', function () { showNetworkToast(false); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeader);
  } else {
    initHeader();
  }
})();
</script>
