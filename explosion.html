    <script>
        // --- ゲーム状態管理 ---
        const STAGE_RADIUS = 14;
        let aliveCount = 4;
        let survivors = [0, 1, 2, 3];
        let currentTurnIdx = 0;
        let deadlySwitchId = -1;
        let pressedCount = 0; 
        let gameState = 'menu'; 

        // ===== ⏱ 10秒以内にスイッチを選ばないと即爆発ルール =====
        const PLAYER_TIME_LIMIT = 10; // 秒
        let playerTimerInterval = null;
        let playerTimeLeft = PLAYER_TIME_LIMIT;

        // キャラクターデータ (アニメーションフラグ追加)
        const players = [
            { id: 0, name: (window._playerName||'あなた'), color: 0x0088ff, isCPU: false, alive: true, mesh: null, homeX: -6, homeZ: 8, isBlownAway: false, vx: 0, vy: 0, vz: 0, isCelebrating: false, celebrateTick: 0 },
            { id: 1, name: 'CPU1', color: 0xff3333, isCPU: true, alive: true, mesh: null, homeX: -2, homeZ: 8, isBlownAway: false, vx: 0, vy: 0, vz: 0, isCelebrating: false, celebrateTick: 0 },
            { id: 2, name: 'CPU2', color: 0x33cc33, isCPU: true, alive: true, mesh: null, homeX: 2, homeZ: 8, isBlownAway: false, vx: 0, vy: 0, vz: 0, isCelebrating: false, celebrateTick: 0 },
            { id: 3, name: 'CPU3', color: 0xff33cc, isCPU: true, alive: true, mesh: null, homeX: 6, homeZ: 8, isBlownAway: false, vx: 0, vy: 0, vz: 0, isCelebrating: false, celebrateTick: 0 }
        ];

        let switches = [];
        let particles = [];
        let activePlayer = null;
        let activeSwitch = null;

        // 3Dレイヤー & カメラ制御用ベクトル (ドキドキズーム演出用)
        let scene, camera, renderer, witchMesh, floorMesh, shockwaveMesh;
        // 【スマホ対応】基準カメラ位置（横長画面用に調整済みの元の値）
        const CAMERA_BASE_POS = new THREE.Vector3(0, 16, 18);
        const CAMERA_BASE_LOOK = new THREE.Vector3(0, 1.5, 1);
        const CAMERA_BASE_ASPECT = 1.6; // このアスペクト比で元のフレーミングになる

        const cameraDefaultPos = CAMERA_BASE_POS.clone();
        const cameraDefaultLook = CAMERA_BASE_LOOK.clone();
        const cameraCurrentPos = CAMERA_BASE_POS.clone();
        const cameraCurrentLook = CAMERA_BASE_LOOK.clone();
        const cameraTargetPos = CAMERA_BASE_POS.clone();
        const cameraTargetLook = CAMERA_BASE_LOOK.clone();

        // 【スマホ対応】縦長（スマホ）画面では横方向の視野が狭くなり、
        // 一番左右のスイッチが画面外に隠れてしまうため、
        // 画面のアスペクト比に応じてカメラを後方へ引いて全スイッチが収まるようにする
        function updateCameraFraming() {
            const aspect = window.innerWidth / window.innerHeight;
            let zoomFactor = 1;
            if (aspect < CAMERA_BASE_ASPECT) {
                zoomFactor = CAMERA_BASE_ASPECT / aspect;
                zoomFactor = Math.min(zoomFactor, 2.3); // 引きすぎ防止の上限
            }
            const offset = CAMERA_BASE_POS.clone().sub(CAMERA_BASE_LOOK).multiplyScalar(zoomFactor);
            cameraDefaultPos.copy(CAMERA_BASE_LOOK).add(offset);
            cameraDefaultLook.copy(CAMERA_BASE_LOOK);
        }
        updateCameraFraming();

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredBtn = null;
        let cameraShake = 0;

        // --- 音響システム ---
        let audioCtx = null;
        
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'suspense') {
                    // 心臓の鼓動を模した重低音
                    osc.type = 'sine'; osc.frequency.setValueAtTime(65, audioCtx.currentTime); 
                    gain.gain.setValueAtTime(1.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'safe') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(1300, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch (e) { console.warn(e); }
        }

        function playUltraExplosionSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

                const subOsc = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                subOsc.type = 'sine'; subOsc.frequency.setValueAtTime(200, audioCtx.currentTime);
                subOsc.frequency.linearRampToValueAtTime(5, audioCtx.currentTime + 2.0);
                subGain.gain.setValueAtTime(2.5, audioCtx.currentTime); 
                subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
                subOsc.connect(subGain); subGain.connect(audioCtx.destination);
                subOsc.start(); subOsc.stop(audioCtx.currentTime + 2.2);

                const bufferSize = audioCtx.sampleRate * 3.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1600, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 2.8);

                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(3.0, audioCtx.currentTime); 
                noiseGain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.25);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.0);

                noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
                noise.start(); noise.stop(audioCtx.currentTime + 3.0);
            } catch (e) { console.warn(e); }
        }

        function witchSpeak(text, onComplete) {
            try {
                const isChecked = document.getElementById('toggle-dialogue-cb').checked;
                const dialogueDiv = document.getElementById('witch-dialogue');
                
                // 魔女絵文字をさらに巨大化(3.8rem)・多重立体ドロップシャドウで超リアル化
                dialogueDiv.innerHTML = "<span style='font-size: 3.8rem; display: inline-block; filter: drop-shadow(5px 8px 10px rgba(0,0,0,0.65)) drop-shadow(-2px -2px 4px rgba(130,0,255,0.4)); vertical-align: middle; margin-right: 15px;'><span class='witch-img' role='img' aria-label='魔女'></span></span><span style='display:inline-block; vertical-align: middle; text-align: left;'>「" + text + "」</span>";
                
                if (isChecked) {
                    dialogueDiv.style.display = 'flex';
                } else {
                    dialogueDiv.style.display = 'none';
                }

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ja-JP'; utterance.pitch = 0.25; utterance.rate = 0.95;
                    
                    let finished = false;
                    const finishAction = () => {
                        if(finished) return; finished = true;
                        setTimeout(() => { if(!text.includes("勝ち") && !text.includes("大破裂")) dialogueDiv.style.display = 'none'; }, 1500);
                        if(onComplete) onComplete();
                    };
                    utterance.onend = finishAction; utterance.onerror = finishAction;
                    window.speechSynthesis.speak(utterance);
                    setTimeout(finishAction, text.length * 400 + 2000);
                } else {
                    setTimeout(() => {
                        setTimeout(() => { dialogueDiv.style.display = 'none'; }, 1500);
                        if(onComplete) onComplete();
                    }, 2500);
                }
            } catch (e) { if(onComplete) onComplete(); }
        }

        function setupSwitches() {
            switches.forEach(s => scene.remove(s.group));
            switches = [];
            pressedCount = 0; 

            let count = 5;
            if (aliveCount === 3) count = 4;
            if (aliveCount === 2) count = 3;

            const spacing = 2.4;
            const startX = -((count - 1) * spacing) / 2;

            for(let i=0; i<count; i++) {
                const group = new THREE.Group();
                group.position.set(startX + (i * spacing), 0, 2);

                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.9, 0.4, 24), new THREE.MeshStandardMaterial({ color: 0x33333b, metalness: 0.7 }));
                base.position.y = 0.2; group.add(base);

                const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 24), new THREE.MeshStandardMaterial({ color: 0xcc1111, emissive: 0x330000 }));

                // キーボード番号表示（1〜）

                numCanvas.width = 64; numCanvas.height = 64;
                const nctx = numCanvas.getContext('2d');
                nctx.clearRect(0,0,64,64);

                nctx.fillStyle = '#fff';
                nctx.font = 'bold 36px sans-serif';

        function startGame() {
            playSound('click');
            clearPlayerTimer();
            document.getElementById('menu').style.display = 'none';
            document.getElementById('leaderboard').innerHTML = '';

            aliveCount = 4; survivors = [0, 1, 2, 3]; currentTurnIdx = 0;

            players.forEach(p => {
                p.alive = true; p.isBlownAway = false; p.isCelebrating = false;
                p.mesh.position.set(p.homeX, 0, p.homeZ);
                p.mesh.rotation.set(0, 0, 0); p.mesh.scale.set(1, 1, 1); p.mesh.visible = true;
            });

            witchMesh.visible = true; witchMesh.scale.set(8, 8, 1);
            cameraTargetPos.copy(cameraDefaultPos);
            cameraTargetLook.copy(cameraDefaultLook);
            startRound();
        }

        function startRound() {
            if (survivors.length <= 1) { endGame(); return; }

            // カメラ位置リセット
            cameraTargetPos.copy(cameraDefaultPos);
            cameraTargetLook.copy(cameraDefaultLook);

            if (!witchMesh.visible) {
                witchMesh.visible = true;
                witchMesh.scale.set(0.1, 0.1, 0.1);
                let respawnTick = 0;
                // 【アニメーション強化】回転しながら弾むように巨大化復活
                function witchRespawnAnim() {
                    respawnTick += 0.04;
                    const s = 8.0 * Math.sin(respawnTick * Math.PI * 0.5 * 1.15);
                    witchMesh.scale.set(Math.max(0.1, s), Math.max(0.1, s), 1);
                    witchMesh.rotation.z = (1.0 - respawnTick) * Math.PI * 2;
                    if (respawnTick < 1.0) {
                        requestAnimationFrame(witchRespawnAnim);
                    } else {
                        witchMesh.scale.set(8, 8, 1);
                        witchMesh.rotation.set(0, 0, 0);
                    }
                }
                witchRespawnAnim();
            }

            setupSwitches(); 
            gameState = 'resolve';

            let count = (aliveCount === 4) ? 5 : ((aliveCount === 3) ? 4 : 3);
            witchSpeak(`おいじぃ復活じゃ！生存者${aliveCount}人だからスイッチは${count}個じゃ！`, () => {
                nextTurn();
            });
        }

        function nextTurn() {
            activePlayer = players[survivors[currentTurnIdx]];
            const indicator = document.getElementById('turn-indicator');
            indicator.innerText = `${activePlayer.name} のターン`;
            indicator.style.color = activePlayer.isCPU ? "#ff3333" : "#0055ff";

            if (!activePlayer.isCPU) {
                gameState = 'player_wait';
                startPlayerTimer(); // プレイヤーは10秒以内にスイッチを選ぶ
            } else {
                gameState = 'cpu_wait';
                setTimeout(() => {
                    const available = switches.filter(s => !s.pressed);
                    const choice = available[Math.floor(Math.random() * available.length)];
                    triggerMoveToButton(choice);
                }, 1000);
            }
        }

        // ===== ⏱ 10秒以内に選ばないと爆発：タイマー制御 =====
        function startPlayerTimer() {
            clearPlayerTimer();
            playerTimeLeft = PLAYER_TIME_LIMIT;
            updatePlayerTimerDisplay();
            playerTimerInterval = setInterval(() => {
                if (gameState !== 'player_wait') { clearPlayerTimer(); return; }
                playerTimeLeft--;
                if (playerTimeLeft > 0) {
                    updatePlayerTimerDisplay();
                    playSound('suspense');
                }
                if (playerTimeLeft <= 0) {
                    clearPlayerTimer();
                    timeoutExplosion();
                }
            }, 1000);
        }
        function clearPlayerTimer() {
            if (playerTimerInterval) { clearInterval(playerTimerInterval); playerTimerInterval = null; }
            const td = document.getElementById('player-timer');
            if (td) { td.style.display = 'none'; td.classList.remove('danger'); }
        }
        function updatePlayerTimerDisplay() {
            const td = document.getElementById('player-timer');
            const num = document.getElementById('player-timer-num');
            if (!td || !num) return;
            num.innerText = playerTimeLeft;
            if (playerTimeLeft <= 3) { td.classList.add('danger'); } else { td.classList.remove('danger'); }
            td.style.display = 'block';
        }
        // 時間切れ：即大爆発してプレイヤーが負け
        function timeoutExplosion() {
            if (gameState !== 'player_wait') return;
            // 位置決め用に未押下スイッチを1つ選び、致命的スイッチとして扱う
            const available = switches.filter(s => !s.pressed);
            activeSwitch = available.length > 0 ? available[0] : switches[0];
            if (activeSwitch) { activeSwitch.pressed = true; }
            document.getElementById('turn-indicator').innerText = "⏰ 時間切れ！即爆発！ ⏰";
            triggerSuperExplosion();
        }

        function triggerMoveToButton(sw) {
            gameState = 'walk_to_button';
            clearPlayerTimer(); // スイッチを選んだのでタイマー停止
            activeSwitch = sw;
            sw.pressed = true;
            activePlayer.targetX = sw.x;
            activePlayer.targetZ = sw.z + 1.2; 
        }

        // --- 【ドキドキ増強＆時間延長】緊迫のカメラクローズアップシステム ---
        function triggerPressButton(sw) {
            gameState = 'suspense';
            sw.button.position.y = 0.25; 
            playSound('click');
            document.getElementById('turn-indicator').innerText = "……カチッ……";

            // ドキドキ演出：該当スイッチとプレイヤーの目前までカメラが猛烈にズームイン！
            cameraTargetPos.set(sw.x * 0.7, 5.5, sw.z + 4.5);
            cameraTargetLook.set(sw.x, 0.6, sw.z);

            let count = 0;
            const interval = setInterval(() => {
                if (gameState !== 'suspense') { clearInterval(interval); return; }
                
                playSound('suspense'); 
                // カウント（時間経過）が進むほど、心音と同期してカメラの震え（緊迫感）を増幅！
                cameraShake = (count + 1) * 0.55; 
                
                count++;
                if (count >= 5) { // カウントを3回から5回に延長（タメ時間を長くしスリルを最大化）
                    clearInterval(interval);
                    resolveChoice();
                }
            }, 500); // じわじわと引き伸ばされる恐怖の2.5秒間
        }

        function resolveChoice() {
            gameState = 'resolve';

            if (activeSwitch.id === deadlySwitchId) {
                triggerSuperExplosion();
            } else {
                playSound('safe');
                pressedCount++;
                document.getElementById('turn-indicator').innerText = "✨ セーフ！ ✨";
                
                // 【アニメーション強化】セーフになった喜びを全身で表現する大ジャンプスピン
                activePlayer.isCelebrating = true;
                activePlayer.celebrateTick = 0;

                setTimeout(() => {
                    // カメラ位置をデフォルトに戻す
                    cameraTargetPos.copy(cameraDefaultPos);
                    cameraTargetLook.copy(cameraDefaultLook);

                    let p = activePlayer;
                    let tick = 0;
                    function walkBack() {
                        tick += 0.08;
                        p.mesh.position.lerp(new THREE.Vector3(p.homeX, 0, p.homeZ), 0.15);
                        if(tick < 1.0) requestAnimationFrame(walkBack);
                        else {
                            p.mesh.position.set(p.homeX, 0, p.homeZ);
                            
                            let targetSafeCount = (aliveCount === 4) ? 4 : ((aliveCount === 3) ? 3 : 2);
                            if (pressedCount === targetSafeCount) {
                                document.getElementById('turn-indicator').innerText = "🎉 全員セーフ！リセット！ 🎉";
                                witchSpeak("全員セーフじゃな！スイッチをリセットして仕切り直しじゃ！", () => {
                                    startRound();
                                });
                            } else {
                                currentTurnIdx = (currentTurnIdx + 1) % survivors.length;
                                nextTurn();
                            }
                        }
                    }
                    walkBack();
                }, 1200);
            }
        }

        function triggerSuperExplosion() {
            gameState = 'explode';
            cameraShake = 22.0; // 前作を超える超強烈なカメラの超絶大激震！
            playUltraExplosionSound(); 

            document.body.style.backgroundColor = '#ff0000';
            setTimeout(() => { document.body.style.backgroundColor = '#ffffff'; }, 40);
            setTimeout(() => { document.body.style.backgroundColor = '#ff3300'; }, 80);
            setTimeout(() => { document.body.style.backgroundColor = '#d2d7df'; }, 160);

            document.getElementById('turn-indicator').innerText = "💥 おいじぃ超大破裂！！ 💥";

            witchMesh.visible = false; 

            shockwaveMesh.position.set(0, 3, -1);
            shockwaveMesh.scale.set(1, 1, 1);
            shockwaveMesh.material.opacity = 1.0;
            shockwaveMesh.material.color.setHex(0xff4400);

            spawnAdvancedParticles(0, 3, -1, 1600, 'witch_flesh'); 
            spawnAdvancedParticles(0, 3, -1, 1400, 'spark');       
            spawnAdvancedParticles(0, 3, -1, 1100, 'smoke');       
            spawnAdvancedParticles(activeSwitch.x, 0.5, activeSwitch.z, 400, 'spark');

            activePlayer.isBlownAway = true;
            activePlayer.alive = false;
            activePlayer.rank = aliveCount;
            if (activePlayer.id === 0 && window.parent) {
                window.parent.postMessage({ type: 'gameEnd', rank: activePlayer.rank }, '*');
            }
            
            activePlayer.vx = (Math.random() - 0.5) * 40;
            activePlayer.vy = 50 + Math.random() * 20;
            activePlayer.vz = 30 + Math.random() * 20;

            const leaderboard = document.getElementById('leaderboard');
            const rankBox = document.createElement('div');
            rankBox.className = `rank-box rank-${activePlayer.rank}`;
            rankBox.innerText = `${activePlayer.rank}位：${activePlayer.name}`;
            leaderboard.appendChild(rankBox);

            aliveCount--;
            survivors = survivors.filter(id => id !== activePlayer.id);

            setTimeout(() => {
                witchSpeak("ぎゃあああーーー！！！わしが完全に木っ端微塵の大破裂じゃーーー！！！");
            }, 400);

            setTimeout(() => {
                currentTurnIdx = currentTurnIdx % survivors.length;
                startRound(); 
            }, 5500);
        }

        function spawnAdvancedParticles(x, y, z, count, type) {
            let pGeo;
            if (type === 'smoke') {
                pGeo = new THREE.SphereGeometry(0.7, 6, 6);
            } else {
                pGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35); 
            }
            
            let colors = [0xffdd00, 0xff2200, 0xffffff, 0xff9900]; // 元コードの構文エラー(#表記)を完全修正
            if (type === 'witch_flesh') colors = [0x440077, 0x111111, 0xaa00aa, 0x221133, 0xff0055]; 
            if (type === 'smoke') colors = [0x252525, 0x3a3a3a, 0x151515, 0x4f4f4f]; 

            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshBasicMaterial({ 
                    color: colors[Math.floor(Math.random() * colors.length)],
                    transparent: true,
                    opacity: type === 'smoke' ? 0.7 : 1.0
                });
                const mesh = new THREE.Mesh(pGeo, mat);
                mesh.position.set(x + (Math.random()-0.5)*0.5, y + (Math.random()-0.5)*0.5, z + (Math.random()-0.5)*0.5);
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const pitch = Math.random() * Math.PI;
                
                let speed = 18 + Math.random() * 32; 
                if (type === 'spark') speed = 45 + Math.random() * 40; 
                if (type === 'smoke') speed = 5 + Math.random() * 9;    

                particles.push({
                    mesh: mesh,
                    type: type,
                    vx: Math.cos(angle) * Math.sin(pitch) * speed,
                    vy: Math.sin(angle) * Math.sin(pitch) * speed + (type === 'smoke' ? 4 : 8),
                    vz: Math.cos(pitch) * speed,
                    life: type === 'smoke' ? 2.0 + Math.random() : 1.0 + Math.random() * 1.2
                });
            }
        }

        function endGame() {
            gameState = 'menu';
            clearPlayerTimer();
            const winnerId = survivors[0];
            const winner = players[winnerId];

            if (winnerId === 0 && window.parent) {
                window.parent.postMessage({ type: 'gameEnd', rank: 1 }, '*');
            }

            const leaderboard = document.getElementById('leaderboard');
            const rankBox = document.createElement('div');
            rankBox.className = `rank-box rank-1`;
            rankBox.innerText = `👑 1位: ${winner.name}`;
            leaderboard.appendChild(rankBox);

            if (winnerId === 0) {
                witchSpeak(`勝者は${(window._playerName||'あなた')}じゃ！凄まじい悪運じゃて！`);
            } else {
                witchSpeak(`勝者は ${winner.name} じゃ！お前さんは塵となったのう。`);
            }

            setTimeout(() => {
                document.getElementById('menu').style.display = 'flex';
                document.getElementById('turn-indicator').innerText = "ゲーム終了";
            }, 4000);
        }

        // --- スマホ・PCハイブリッド型ポインター制御機構 ---
        function getPointerXY(e) {
            const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
            return { x: clientX, y: clientY };
        }

        function onPointerMove(e) {
            if (gameState !== 'player_wait') return;
            const pos = getPointerXY(e);
            mouse.x = (pos.x / window.innerWidth) * 2 - 1;
            mouse.y = -(pos.y / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(switches.map(s => s.button));
            if (intersects.length > 0) {
                const target = intersects[0].object;
                const sw = switches.find(s => s.button === target);
                if (!sw.pressed) {
                    if (hoveredBtn && hoveredBtn !== target) hoveredBtn.material.emissive.setHex(0x330000);
                    hoveredBtn = target;
                    document.body.style.cursor = 'pointer';
                    target.material.emissive.setHex(0x770000);
                }
            } else {
                if (hoveredBtn) { hoveredBtn.material.emissive.setHex(0x330000); hoveredBtn = null; }
                document.body.style.cursor = 'default';
            }
        }

        function onPointerDown(e) {
            if (gameState !== 'player_wait') return;
            const pos = getPointerXY(e);
            mouse.x = (pos.x / window.innerWidth) * 2 - 1;
            mouse.y = -(pos.y / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(switches.map(s => s.button));
            if (intersects.length > 0) {
                const target = intersects[0].object;
                const sw = switches.find(s => s.button === target);
                if (sw && !sw.pressed) {
                    document.body.style.cursor = 'default';
                    if (hoveredBtn) hoveredBtn.material.emissive.setHex(0x330000);
                    hoveredBtn = null;
                    triggerMoveToButton(sw);
                }
            }
        }

        // --- メインループ ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // 【アニメーション強化】おいじぃのダイナミック浮遊＆左右の怪しい揺らぎ
            if (witchMesh && witchMesh.visible) {
                const time = Date.now() * 0.003;
                witchMesh.position.y = 4.5 + Math.sin(time) * 0.35; // 振幅強化
                witchMesh.position.x = Math.cos(time * 0.7) * 0.25;  // 左右の揺れ追加
            }

            if (gameState === 'explode' && shockwaveMesh.material.opacity > 0.01) {
                shockwaveMesh.scale.addScalar(95 * dt); 
                shockwaveMesh.material.opacity *= 0.86; 
            } else if (gameState !== 'explode') {
                shockwaveMesh.material.opacity = 0;
            }

            // カメラのラープ追従シミュレーション (ズーム＆激震の融合)
            cameraCurrentPos.lerp(cameraTargetPos, 0.08);
            cameraCurrentLook.lerp(cameraTargetLook, 0.08);

            let cx = cameraCurrentPos.x;
            let cy = cameraCurrentPos.y;
            let cz = cameraCurrentPos.z;

            if (cameraShake > 0.01) {
                cx += (Math.random() - 0.5) * cameraShake;
                cy += (Math.random() - 0.5) * cameraShake;
                cz += (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.91; 
            }
            camera.position.set(cx, cy, cz);
            camera.lookAt(cameraCurrentLook);

            // 【アニメーション強化】スイッチへのダイナミック移動（高跳び仕様）
            if (gameState === 'walk_to_button' && activePlayer) {
                const pPos = activePlayer.mesh.position;
                const target = new THREE.Vector3(activePlayer.targetX, 0, activePlayer.targetZ);
                pPos.lerp(target, 0.13);
                pPos.y = Math.abs(Math.sin(Date.now() * 0.022)) * 0.85; // 跳ねる高さを倍増
                activePlayer.mesh.rotation.x = Math.sin(Date.now() * 0.022) * 0.3; // 前後ピッチを追加

                if (pPos.distanceTo(target) < 0.15) {
                    pPos.set(activePlayer.targetX, 0, activePlayer.targetZ);
                    activePlayer.mesh.rotation.set(0, 0, 0);
                    triggerPressButton(activeSwitch);
                }
            }

            // セーフ時アクロバティックお祝いアニメーションの処理
            players.forEach(p => {
                if (p.isCelebrating) {
                    p.celebrateTick += dt * 3.5;
                    p.mesh.position.y = Math.sin(p.celebrateTick * Math.PI) * 2.2; // 大ジャンプ
                    p.mesh.rotation.y = p.celebrateTick * Math.PI * 4; // 高速2回転スピン
                    if (p.celebrateTick >= 1.0) {
                        p.isCelebrating = false;
                        p.mesh.position.y = 0;
                        p.mesh.rotation.set(0, 0, 0);
                    }
                }
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                
                if (p.type === 'smoke') {
                    p.vy += 2.8 * dt; 
                    p.vx *= 0.91; p.vz *= 0.91;
                    p.mesh.scale.addScalar(5.5 * dt); 
                } else {
                    p.vy -= 18.0 * dt; 
                    p.vx *= 0.97; p.vz *= 0.97;
                }

                p.life -= dt;
                const ratio = Math.max(0, p.life);
                if (p.type !== 'smoke') p.mesh.scale.set(ratio, ratio, ratio);
                p.mesh.material.opacity = Math.min(ratio, p.type === 'smoke' ? 0.7 : 1.0);

                if (p.life <= 0) {
                    scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose();
                    particles.splice(i, 1);
                }
            }

            players.forEach(p => {
                if (p.isBlownAway) {
                    p.mesh.position.x += p.vx * dt;
                    p.mesh.position.y += p.vy * dt;
                    p.mesh.position.z += p.vz * dt;

                    p.vy -= 25 * dt; 

                    p.mesh.rotation.x += 14 * dt;
                    p.mesh.rotation.y += 20 * dt;

                    if (p.mesh.position.y > 28 || p.mesh.position.y < -5 || Math.abs(p.mesh.position.x) > 35) {
                        p.mesh.visible = false;
                        p.isBlownAway = false; 
                    }
                }
            });

            renderer.render(scene, camera);
        }

        init3D();
        animate();
        if (location.search.includes('challenge=1')) {
            setTimeout(() => { startGame(); }, 300);
        }
    
        // ===== キーボード操作（スイッチ選択 1〜N） =====
        (function setupExplosionKeyboard() {
            let kbHoverIdx = -1;
            function clearKbHover() {
                if (kbHoverIdx >= 0 && switches[kbHoverIdx] && switches[kbHoverIdx].button) {
                    switches[kbHoverIdx].button.material.emissive.setHex(0x330000);
                }
                kbHoverIdx = -1;
            }
            window.addEventListener('keydown', function(e) {
                if (e.repeat) return;
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                if (typeof gameState === 'undefined' || gameState !== 'player_wait') return;
                if (!switches || !switches.length) return;

                const key = e.key;
                // 左右矢印でハイライト移動
                if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
                    e.preventDefault();
                    const avail = switches.map((s,i)=>({s,i})).filter(x => !x.s.pressed);
                    if (!avail.length) return;
                    let cur = avail.findIndex(x => x.i === kbHoverIdx);
                    cur = cur <= 0 ? avail.length - 1 : cur - 1;
                    clearKbHover();
                    kbHoverIdx = avail[cur].i;
                    switches[kbHoverIdx].button.material.emissive.setHex(0x770000);
                    return;
                }
                if (key === 'ArrowRight' || key === 'd' || key === 'D') {
                    e.preventDefault();
                    const avail = switches.map((s,i)=>({s,i})).filter(x => !x.s.pressed);
                    if (!avail.length) return;
                    let cur = avail.findIndex(x => x.i === kbHoverIdx);
                    cur = (cur < 0 || cur >= avail.length - 1) ? 0 : cur + 1;
                    clearKbHover();
                    kbHoverIdx = avail[cur].i;
                    switches[kbHoverIdx].button.material.emissive.setHex(0x770000);
                    return;
                }
                // Enter/Space でハイライト中のスイッチを押す
                if (key === 'Enter' || key === ' ') {
                    if (kbHoverIdx >= 0 && switches[kbHoverIdx] && !switches[kbHoverIdx].pressed) {
                        e.preventDefault();
                        const sw = switches[kbHoverIdx];
                        clearKbHover();
                        if (typeof triggerMoveToButton === 'function') triggerMoveToButton(sw);
                    }
                    return;
                }
                // 数字キー 1-9 で直接選択（左から順）
                if (/^[1-9]$/.test(key)) {
                    const idx = parseInt(key, 10) - 1;
                    if (idx >= 0 && idx < switches.length && !switches[idx].pressed) {
                        e.preventDefault();
                        clearKbHover();
                        if (typeof triggerMoveToButton === 'function') triggerMoveToButton(switches[idx]);
                    }
                }
            });
            // 状態が変わったらハイライト解除
            const _origTrigger = window.triggerMoveToButton;
        })();

    </script>













<script>
/* =========================================================
   おいじぃ魔女大爆発 — オンライン対戦拡張
   P2P: PeerJS/WebRTC / 権威ホスト: ルーム主ブラウザ
========================================================= */
(function(){
    'use strict';

    const ONLINE = {
        peer: null,
        role: null,                 // 'host' | 'guest'
        roomCode: '',
        localId: 0,
        hostPeerId: '',
        hostConn: null,
        conns: new Map(),
        playerByPeer: new Map(),
        started: false,
        seq: 0,
        guestDeadline: 0,
        guestTimer: null,
        guestReplaying: false,
        applying: false,
        localGameEndSent: false,
        autoAction: null,
        autoJoinCode: '',
        joinRetry: 0
    };

    const ONLINE_CODE_CHARS = '0123456789';
    const ONLINE_MAX_PLAYERS = 4;

    function isOnlineHost(){ return ONLINE.role === 'host'; }
    function isOnlineGuest(){ return ONLINE.role === 'guest'; }
    function onlineNowName(){
        const el = document.getElementById('online-player-name');
        const raw = (el && el.value || window._playerName || '').trim();
        return raw.slice(0,16) || 'プレイヤー';
    }
    function onlineRoomPeerId(code){ return 'oijiiw-blast-' + String(code).toLowerCase(); }
    function onlineGenCode(){
        let s='';
        for(let i=0;i<4;i++) s += ONLINE_CODE_CHARS[Math.floor(Math.random()*ONLINE_CODE_CHARS.length)];
        return s;
    }
    function onlineSetStatus(msg){ const el=document.getElementById('online-room-status'); if(el) el.textContent=msg; }
    function onlineSetError(msg){
        const el=document.getElementById('online-lobby-error');
        if(!el) return;
        el.textContent=msg||'';
        el.style.display=msg?'block':'none';
    }
    function onlineShowLobby(show=true){
        const ov=document.getElementById('online-lobby-overlay');
        if(!ov) return;
        ov.classList.toggle('show',!!show); ov.setAttribute('aria-hidden',show?'false':'true');
    }
    function onlineSetPlayerNameDefault(){
        const el=document.getElementById('online-player-name');
        if(el) el.value = String(window._playerName || localStorage.getItem('oijii_explosion_online_name') || 'プレイヤー').slice(0,16);
    }
    function onlineSavePlayerName(){
        const n=onlineNowName();
        try{ localStorage.setItem('oijii_explosion_online_name',n); }catch(e){}
        return n;
    }

    function onlineDisconnectAll(){
        ONLINE.normalEnd=false;
        try { ONLINE.conns.forEach(c=>{ try{c.close();}catch(e){} }); } catch(e){}
        try { if(ONLINE.hostConn) ONLINE.hostConn.close(); }catch(e){}
        try { if(ONLINE.peer && !ONLINE.peer.destroyed) ONLINE.peer.destroy(); }catch(e){}
        clearGuestTimer();
        ONLINE.peer=null; ONLINE.role=null; ONLINE.roomCode=''; ONLINE.localId=0; ONLINE.hostPeerId=''; ONLINE.hostConn=null;
        ONLINE.conns.clear(); ONLINE.playerByPeer.clear(); ONLINE.started=false; ONLINE.guestReplaying=false;
        ONLINE.autoAction=null; ONLINE.autoJoinCode='';
    }

    function onlineSend(conn, msg){
        if(!conn || !conn.open) return false;
        try { conn.send(Object.assign({v:1, seq:++ONLINE.seq}, msg)); return true; } catch(e){ return false; }
    }
    function onlineBroadcast(msg){
        ONLINE.conns.forEach(c=>onlineSend(c,msg));
    }
    function onlineHostSnapshot(){
        return players.map(p=>({
            id:p.id, name:p.name, color:p.color, isCPU:!!p.isCPU, alive:!!p.alive, rank:p.rank||null
        }));
    }
    function onlineApplyPlayers(list){
        if(!Array.isArray(list)) return;
        list.forEach(q=>{
            const p=players[q.id]; if(!p) return;
            p.name=q.name || ('P'+(q.id+1));
            p.isCPU=!!q.isCPU;
            if(q.rank!=null) p.rank=q.rank;
            if(q.alive!=null) p.alive=!!q.alive;
        });
        if(window._playerName && players[ONLINE.localId]) players[ONLINE.localId].name=window._playerName;
    }
    function onlineHumanCount(){ return players.filter(p=>!p.isCPU).length; }
    function onlineLocalStatus(){
        const p=players[ONLINE.localId];
        if(!p) return '';
        return p.id===0 ? '部屋主' : 'オンライン参加者';
    }
    function onlineRenderPlayerList(){
        const list=document.getElementById('online-player-list');
        const count=document.getElementById('online-players-count');
        if(!list) return;
        const connected = players.filter(p=>!p.isCPU).length;
        if(count) count.textContent=connected+'/4';
        list.innerHTML='';
        players.forEach(p=>{
            const row=document.createElement('div'); row.className='online-player-row';
            const av=document.createElement('div'); av.className='online-player-avatar';
            av.textContent = p.id===0 ? '👑' : (p.isCPU ? '🤖' : '👤');
            const main=document.createElement('div'); main.className='online-player-main';
            const nm=document.createElement('div'); nm.className='online-player-name'; nm.textContent=p.name || ('P'+(p.id+1));
            const meta=document.createElement('div'); meta.className='online-player-meta'; meta.textContent=(p.isCPU?'CPU待機':(p.id===ONLINE.localId?'あなた':'オンライン'));
            main.append(nm,meta);
            const badge=document.createElement('div'); badge.className='online-player-badge'; badge.textContent=p.isCPU?'CPU':(p.id===0?'HOST':'READY');
            row.append(av,main,badge); list.appendChild(row);
        });
        const startBtn=document.getElementById('online-start-btn');
        if(startBtn) startBtn.style.display=isOnlineHost()?'block':'none';
    }

    function onlineOpenChoice(){
        onlineSetPlayerNameDefault();
        document.getElementById('online-lobby-choice').style.display='block';
        document.getElementById('online-lobby-room').style.display='none';
        onlineSetError('');
        onlineSetStatus('');
        onlineShowLobby(true);
    }
    function onlineEnterRoomPanel(mode){
        document.getElementById('online-lobby-choice').style.display='none';
        document.getElementById('online-lobby-room').style.display='block';
        document.getElementById('online-join-input-wrap').style.display=(mode==='join')?'block':'none';
        const start=document.getElementById('online-start-btn'); if(start) start.style.display=(mode==='create')?'block':'none';
        onlineRenderPlayerList();
    }

    window.onlineChooseCreate = async function(){
        const name=onlineSavePlayerName();
        if(!window.Peer){ onlineSetError('通信ライブラリを読み込めませんでした。インターネット接続を確認してください。'); return; }
        onlineEnterRoomPanel('create');
        onlineSetStatus('部屋を作成中…');
        onlineSetError('');
        ONLINE.role='host'; ONLINE.localId=0; ONLINE.seq=0; ONLINE.started=false;
        players[0].name=name; players[0].isCPU=false; players[0].alive=true; players[0].rank=null; players[0].onlineRemote=false;
        for(let i=1;i<players.length;i++){ players[i].name='CPU'+i; players[i].isCPU=true; players[i].alive=true; players[i].rank=null; players[i].onlineRemote=false; }
        await onlineHostCreatePeer();
    };

    window.onlineChooseJoin = function(){
        onlineSavePlayerName();
        onlineEnterRoomPanel('join');
        const inp=document.getElementById('online-join-code'); if(inp) setTimeout(()=>inp.focus(),40);
        onlineSetStatus('部屋コードを入力して接続してください。');
        onlineSetError('');
    };

    async function onlineHostCreatePeer(retry=0){
        onlineDisconnectPeerOnly();
        if(retry>5){ onlineSetError('部屋を作れませんでした。ページを再読み込みしてもう一度試してください。'); return; }
        const forced=String((window._oijiiMultiConfig&&window._oijiiMultiConfig.roomCode)||'').replace(/[^0-9]/g,'').slice(0,4); const code=forced||onlineGenCode(); const peerId=onlineRoomPeerId(code);
        const peer=new Peer(peerId,{debug:0});
        ONLINE.peer=peer; ONLINE.roomCode=code;
        peer.on('open',()=>{
            const codeEl=document.getElementById('online-room-code'); if(codeEl) codeEl.textContent=code;
            onlineSetStatus('部屋作成完了。友達にこのコードを送って参加してもらってください。');
            onlineRenderPlayerList();
        });
        peer.on('connection',conn=>onlineHostAccept(conn));
        peer.on('error',err=>{
            if(err && err.type==='unavailable-id'){ onlineHostCreatePeer(retry+1); return; }
            onlineSetError('通信エラー: '+(err && err.message ? err.message : String(err||'unknown')));
            onlineSetStatus('接続をやり直してください。');
        });
        peer.on('disconnected',()=>onlineSetStatus('通信サーバーとの接続が切れました。再接続を試みています…'));
        peer.on('close',()=>{});
    }

    function onlineDisconnectPeerOnly(){
        try{ ONLINE.conns.forEach(c=>{try{c.close();}catch(e){}}); }catch(e){}
        ONLINE.conns.clear(); ONLINE.playerByPeer.clear();
        try{ if(ONLINE.peer && !ONLINE.peer.destroyed) ONLINE.peer.destroy(); }catch(e){}
        ONLINE.peer=null;
    }

    function onlineHostAccept(conn){
        if(!conn) return;
        ONLINE.normalEnd=false;
        conn.on('open',()=>{
            if(ONLINE.started){ onlineSend(conn,{type:'error',message:'この対戦はすでに開始されています。'}); try{conn.close();}catch(e){}; return; }
            if(onlineHumanCount()>=ONLINE_MAX_PLAYERS){ onlineSend(conn,{type:'error',message:'この部屋は満員です。'}); try{conn.close();}catch(e){}; return; }
            const slot=players.find(p=>p.id>0 && p.isCPU);
            if(!slot){ onlineSend(conn,{type:'error',message:'参加枠がありません。'}); try{conn.close();}catch(e){}; return; }
            const name=String((conn.metadata&&conn.metadata.name)||('ゲスト'+slot.id)).slice(0,16);
            slot.name=name; slot.isCPU=false; slot.alive=true; slot.rank=null; slot.onlineRemote=true; slot.onlinePeerId=conn.peer;
            ONLINE.conns.set(conn.peer,conn); ONLINE.playerByPeer.set(conn.peer,slot.id); conn.__playerId=slot.id;
            onlineSend(conn,{type:'welcome',localId:slot.id,hostPeerId:ONLINE.peer.id,roomCode:ONLINE.roomCode,players:onlineHostSnapshot()});
            onlineBroadcast({type:'lobby',players:onlineHostSnapshot()});
            onlineSetStatus(name+' が参加しました。対戦開始を待機中…');
            onlineRenderPlayerList();
            /* コレクションから起動したオンライン対戦は、親側でゲームを決定済み。
               このゲーム側では参加者が2人以上そろった時点で権威ホストが自動開始する。 */
            if(window._oijiiAutoStartOnline && !ONLINE.started){
                setTimeout(()=>{
                    try{
                        const need=Math.max(2,Math.min(4,Number((window._oijiiMultiConfig||{}).selectedCount)||2));
                        if(onlineHumanCount()>=need && typeof window.onlineHostStartMatch==='function') window.onlineHostStartMatch();
                    }catch(e){ console.error(e); }
                },180);
            }
        });
        conn.on('data',data=>onlineHostMessage(conn,data));
        conn.on('close',()=>onlineHostDisconnect(conn));
        conn.on('error',()=>onlineHostDisconnect(conn));
    }

    function onlineHostMessage(conn,msg){
        if(!msg || typeof msg!=='object') return;
        if(msg.type==='hello') return;
        if(msg.type==='replay-request') {
            if(!ONLINE.started && typeof window.onlineHostStartMatch==='function'){
                players.forEach(p=>{p.alive=true;p.rank=null;}); survivors=[0,1,2,3]; aliveCount=4; ONLINE.normalEnd=false; ONLINE.started=false;
                try{window.onlineHostStartMatch();}catch(e){}
            }
            return;
        }
        if(msg.type==='choose'){
            const pid=ONLINE.playerByPeer.get(conn.peer);
            if(pid==null || msg.playerId!==pid) return;
            if(!ONLINE.started || gameState!=='player_wait' || !activePlayer || activePlayer.id!==pid) return;
            const idx=Number(msg.switchId); if(!Number.isInteger(idx) || !switches[idx] || switches[idx].pressed) return;
            triggerMoveToButton(switches[idx]);
        }
    }

    function onlineHostDisconnect(conn){
        if(ONLINE.normalEnd || window.__OIJII_SILENT_CLOSE__) return;
        const pid=ONLINE.playerByPeer.get(conn.peer);
        ONLINE.playerByPeer.delete(conn.peer); ONLINE.conns.delete(conn.peer);
        if(pid==null) return;
        const p=players[pid]; if(!p) return;
        p.onlineRemote=false;
        if(!ONLINE.started){ p.isCPU=true; p.name='CPU'+pid; onlineBroadcast({type:'lobby',players:onlineHostSnapshot()}); onlineRenderPlayerList(); onlineSetStatus('参加者が退出しました。'); return; }
        if(window._oijiiMultiConfig && window.parent){ try{ window.parent.postMessage({type:'mp-transport-lost',message:'対戦相手との通信が切断されました。'},'*'); }catch(e){} return; }
        // 対戦中の切断は、その時点で脱落扱い。現在ターンなら強制爆発へ。
        if(p.alive && activePlayer && activePlayer.id===pid && gameState==='player_wait'){
            const available=switches.filter(s=>!s.pressed); activeSwitch=available.length?available[0]:switches[0];
            if(activeSwitch){ activeSwitch.pressed=true; }
            document.getElementById('turn-indicator').innerText='⚠️ 接続切断！強制爆発！ ⚠️';
            triggerSuperExplosion();
        } else {
            p.alive=false; p.rank=survivors.length; survivors=survivors.filter(id=>id!==pid); aliveCount=survivors.length;
            onlineBroadcast({type:'playerDisconnected',playerId:pid,rank:p.rank,aliveCount, survivors:[...survivors],players:onlineHostSnapshot()});
            if(survivors.length<=1) endGame();
        }
    }

    window.onlineJoinConnect = async function(){
        let code=((document.getElementById('online-join-code')||{}).value||'').trim().toUpperCase().replace(/[^0-9]/g,'');
        if(code.length<4){ onlineSetError('4桁の部屋コードを入力してください。'); return; }
        if(!window.Peer){ onlineSetError('通信ライブラリを読み込めませんでした。'); return; }
        const name=onlineSavePlayerName();
        onlineSetError(''); onlineSetStatus('部屋を探しています…');
        ONLINE.role='guest'; ONLINE.roomCode=code; ONLINE.started=false; ONLINE.normalEnd=false; ONLINE.seq=0;
        ONLINE.joinRetry=0;
        players[0].name='ホスト';
        function tryJoinPeer(){
            ONLINE.joinRetry=(ONLINE.joinRetry||0)+1;
            const peer=new Peer({debug:0}); ONLINE.peer=peer;
            let opened=false;
            peer.on('open',()=>{
                const hostId=onlineRoomPeerId(code); ONLINE.hostPeerId=hostId;
                const conn=peer.connect(hostId,{reliable:true,metadata:{name,client:'explosion-online-v1'}});
                ONLINE.hostConn=conn;
                conn.on('open',()=>{ opened=true; onlineSetStatus('部屋に接続しました。参加者一覧を取得中…'); onlineSend(conn,{type:'hello',name}); });
                conn.on('data',data=>onlineGuestMessage(data));
                conn.on('close',()=>{
                    if(ONLINE.started) onlineGuestDisconnectNotice();
                    else if((ONLINE.joinRetry||0)<10){ onlineSetStatus('部屋主を待っています…再接続します。'); setTimeout(tryJoinPeer,900); }
                    else onlineSetStatus('接続失敗');
                });
                conn.on('error',err=>{
                    if(!opened && !ONLINE.started && (ONLINE.joinRetry||0)<10){ try{conn.close();}catch(e){}; setTimeout(tryJoinPeer,900); return; }
                    onlineSetError('接続エラー: '+(err&&err.message?err.message:String(err||'unknown')));
                });
            });
            peer.on('error',err=>{
                if(!ONLINE.started && (ONLINE.joinRetry||0)<10){
                    onlineSetStatus('部屋主を待っています…再接続します。');
                    try{ if(ONLINE.peer===peer && !peer.destroyed) peer.destroy(); }catch(e){}
                    setTimeout(tryJoinPeer,900);
                    return;
                }
                onlineSetError('部屋に接続できませんでした。コードが正しいか、部屋主が接続中か確認してください。');
                onlineSetStatus('接続失敗');
            });
        }
        tryJoinPeer();
    };

    function onlineGuestMessage(msg){
        if(!msg || typeof msg!=='object') return;
        switch(msg.type){
            case 'error': onlineSetError(msg.message||'部屋への参加に失敗しました。'); break;
            case 'welcome':
                ONLINE.localId=Number.isInteger(msg.localId)?msg.localId:1;
                players[ONLINE.localId].name=onlineNowName(); players[ONLINE.localId].isCPU=false; window._playerName=players[ONLINE.localId].name;
                onlineApplyPlayers(msg.players); onlineRenderPlayerList(); onlineSetStatus('参加完了。ホストが対戦を開始するのを待っています。'); break;
            case 'lobby':
                onlineApplyPlayers(msg.players); onlineRenderPlayerList(); onlineSetStatus('参加者一覧を更新しました。'); break;
            case 'gameStart': onlineGuestStartMatch(msg); break;
            case 'roundStart': onlineGuestRoundStart(msg); break;
            case 'turn': onlineGuestTurn(msg); break;
            case 'choose': onlineGuestChoice(msg); break;
            case 'result': onlineGuestResult(msg); break;
            case 'gameOver': onlineGuestGameOver(msg); break;
            case 'playerDisconnected': onlineGuestDisconnected(msg); break;
        }
    }

    function onlineGuestDisconnectNotice(){
        if(ONLINE.normalEnd || window.__OIJII_SILENT_CLOSE__) return;
        if(window._oijiiMultiConfig && window.parent){ try{ window.parent.postMessage({type:'mp-transport-lost',message:'対戦相手との通信が切断されました。'},'*'); }catch(e){} }
        clearGuestTimer();
        const p=players[0];
        if(ONLINE.started){
            onlineSetStatus('部屋主との接続が切れました。ホームへ戻るには「オンライン」を閉じてください。');
            document.getElementById('turn-indicator').innerText='⚠️ 部屋主との接続が切断されました';
            gameState='menu';
            document.getElementById('menu').style.display='flex';
        }
    }

    function onlineGuestStartMatch(msg){
        ONLINE.normalEnd=false;
        ONLINE.started=true; ONLINE.localGameEndSent=false;
        onlineSetStatus('対戦開始！');
        onlineShowLobby(false); document.getElementById('online-lobby-overlay').classList.remove('show');
        if(players[ONLINE.localId]) players[ONLINE.localId].isCPU=false;
        // 元の初期化処理をそのまま使い、ラウンド生成だけはネットワーク命令待ちにする。
        try{ _onlineOrig.startGame.call(window); }catch(e){ console.error(e); }
        if(window.__OIJII_RESULT_REPLAY_REQUESTED__){ window.__OIJII_RESULT_REPLAY_REQUESTED__=false; try{window.parent.postMessage({type:'mp-result-action-done',action:'replay',gameId:'explosion'},'*')}catch(_e){} }
        document.getElementById('menu').style.display='none';
        document.getElementById('leaderboard').innerHTML='';
    }

    function onlineGuestRoundStart(msg){
        if(!ONLINE.started) ONLINE.started=true;
        clearGuestTimer();
        ONLINE.guestReplaying=false;
        aliveCount=Number(msg.aliveCount)||players.filter(p=>p.alive).length;
        survivors=Array.isArray(msg.survivors)?msg.survivors.map(Number):survivors;
        currentTurnIdx=Math.max(0,survivors.indexOf(Number(msg.turnIndex??0)));
        deadlySwitchId=Number(msg.deadlySwitchId);
        onlineApplyPlayers(msg.players||[]);
        players.forEach(p=>{ p.alive=survivors.includes(p.id); if(p.alive && p.mesh){ p.mesh.visible=true; p.mesh.position.set(p.homeX,0,p.homeZ); p.mesh.rotation.set(0,0,0); } });
        cameraTargetPos.copy(cameraDefaultPos); cameraTargetLook.copy(cameraDefaultLook);
        try{ _onlineOrig.startRound.call(window); }catch(e){
            // 完全な視覚リセットだけは確保
            setupSwitches(); gameState='resolve';
            try{ witchSpeak(`おいじぃ復活じゃ！生存者${aliveCount}人だからスイッチは${switches.length}個じゃ！`); }catch(_e){}
        }
        deadlySwitchId=Number(msg.deadlySwitchId);
        gameState='resolve';
    }

    function onlineGuestTurn(msg){
        clearGuestTimer();
        ONLINE.guestDeadline=Number(msg.deadline)||0;
        const pid=Number(msg.playerId); activePlayer=players[pid];
        if(pid<0 || !activePlayer) return;
        currentTurnIdx=Math.max(0,survivors.indexOf(pid));
        const indicator=document.getElementById('turn-indicator');
        if(indicator){ indicator.innerText=activePlayer.name+' のターン'; indicator.style.color=activePlayer.isCPU?'#ff3333':'#0055ff'; }
        if(pid===ONLINE.localId && activePlayer.alive){
            gameState='player_wait'; onlineStartGuestTimer(ONLINE.guestDeadline);
        } else {
            gameState='remote_wait';
        }
    }

    function onlineStartGuestTimer(deadline){
        clearGuestTimer();
        function tick(){
            if(!deadline || gameState!=='player_wait'){ clearGuestTimer(); return; }
            playerTimeLeft=Math.max(0,Math.ceil((deadline-Date.now())/1000)); updatePlayerTimerDisplay();
            if(Date.now()>=deadline){ clearGuestTimer(); return; }
            ONLINE.guestTimer=setTimeout(tick,80);
        }
        tick();
    }
    function clearGuestTimer(){ if(ONLINE.guestTimer){clearTimeout(ONLINE.guestTimer); ONLINE.guestTimer=null;} ONLINE.guestDeadline=0; }

    function onlineGuestChoice(msg){
        if(!ONLINE.started) return;
        const pid=Number(msg.playerId), sid=Number(msg.switchId);
        activePlayer=players[pid]; activeSwitch=switches[sid];
        if(!activePlayer || !activeSwitch) return;
        ONLINE.guestReplaying=true; gameState='remote_wait'; clearGuestTimer();
        try{ _onlineOrig.triggerMoveToButton.call(window,activeSwitch); }catch(e){ ONLINE.guestReplaying=false; }
    }

    function onlineGuestSafeResult(msg){
        clearGuestTimer(); ONLINE.guestReplaying=false;
        const pid=Number(msg.playerId); activePlayer=players[pid]; activeSwitch=switches[Number(msg.switchId)];
        if(!activePlayer) return;
        gameState='resolve'; pressedCount=Number(msg.pressedCount)||0;
        document.getElementById('turn-indicator').innerText='✨ セーフ！ ✨';
        playSound('safe');
        activePlayer.isCelebrating=true; activePlayer.celebrateTick=0;
        setTimeout(()=>{
            cameraTargetPos.copy(cameraDefaultPos); cameraTargetLook.copy(cameraDefaultLook);
            const p=activePlayer; let tick=0;
            function walkBackGuest(){
                tick+=0.08; p.mesh.position.lerp(new THREE.Vector3(p.homeX,0,p.homeZ),0.15);
                if(tick<1.0) requestAnimationFrame(walkBackGuest); else { p.mesh.position.set(p.homeX,0,p.homeZ); }
            }
            walkBackGuest();
        },1200);
    }

    function onlineGuestResult(msg){
        if(!ONLINE.started) return;
        const outcome=msg.outcome;
        if(outcome==='safe'){ onlineGuestSafeResult(msg); return; }
        if(outcome==='explode'){
            clearGuestTimer(); ONLINE.guestReplaying=false;
            const pid=Number(msg.playerId); activePlayer=players[pid]; activeSwitch=switches[Number(msg.switchId)];
            if(!activePlayer || !activeSwitch) return;
            aliveCount=Number(msg.preAliveCount)||aliveCount;
            survivors=Array.isArray(msg.preSurvivors)?msg.preSurvivors.map(Number):survivors;
            deadlySwitchId=Number(msg.deadlySwitchId);
            onlineApplyPlayers(msg.players||[]);
            ONLINE.applying=true;
            try{ _onlineOrig.triggerSuperExplosion.call(window); }catch(e){ console.error(e); }
            ONLINE.applying=false;
            aliveCount=Number(msg.postAliveCount); survivors=Array.isArray(msg.postSurvivors)?msg.postSurvivors.map(Number):survivors;
            players.forEach(p=>p.alive=survivors.includes(p.id));
            if(pid===ONLINE.localId && !ONLINE.localGameEndSent && window.parent){
                ONLINE.localGameEndSent=true; try{ window.parent.postMessage({type:'gameEnd',rank:Number(msg.rank)},'*'); }catch(e){}
            }
        }
    }

    function onlineGuestGameOver(msg){
        ONLINE.normalEnd=true;
        clearGuestTimer(); ONLINE.guestReplaying=false;
        survivors=Array.isArray(msg.survivors)?msg.survivors.map(Number):survivors; aliveCount=survivors.length; onlineApplyPlayers(msg.players||[]);
        const winnerId=Number(msg.winnerId); if(Number.isInteger(winnerId)) survivors=[winnerId];
        if(ONLINE.localId===winnerId && !ONLINE.localGameEndSent && window.parent){
            ONLINE.localGameEndSent=true; try{window.parent.postMessage({type:'gameEnd',rank:1},'*');}catch(e){}
        }
        try{ _onlineOrig.endGame.call(window); }catch(e){}
    }

    function onlineGuestDisconnected(msg){
        const pid=Number(msg.playerId); if(players[pid]){ players[pid].alive=false; players[pid].isCPU=true; }
        survivors=Array.isArray(msg.survivors)?msg.survivors.map(Number):survivors.filter(id=>id!==pid); aliveCount=survivors.length; onlineApplyPlayers(msg.players||[]);
        const p=players[pid]; if(p && p.mesh) p.mesh.visible=false;
        const lb=document.getElementById('leaderboard'); if(lb && p){ const box=document.createElement('div'); box.className='rank-box rank-'+(msg.rank||aliveCount); box.innerText='⚠️ 接続切断：'+p.name; lb.appendChild(box); }
        if(survivors.length<=1) onlineGuestGameOver({winnerId:survivors[0],survivors,players:onlineHostSnapshot()});
    }

    window.onlineHostStartMatch = function(){
        if(!isOnlineHost()) return;
        if(onlineHumanCount()<2){ onlineSetError('オンライン対戦は2人以上で開始してください。'); return; }
        onlineSetError(''); ONLINE.started=true; ONLINE.localGameEndSent=false;
        onlineBroadcast({type:'gameStart',players:onlineHostSnapshot()});
        onlineShowLobby(false);
        document.getElementById('online-lobby-overlay').classList.remove('show');
        try{ _onlineOrig.startGame.call(window); }catch(e){console.error(e);}
    };

    window.onlineCopyRoomCode = async function(){
        const code=ONLINE.roomCode || (document.getElementById('online-room-code')||{}).textContent || '';
        if(!code || code==='----') return;
        try{ await navigator.clipboard.writeText(code); onlineSetStatus('部屋コードをコピーしました。'); }
        catch(e){ onlineSetStatus('コード: '+code); }
    };

    window.onlineBackToChoice = function(){ onlineDisconnectAll(); onlineOpenChoice(); };
    window.onlineCloseLobby = function(){ onlineDisconnectAll(); onlineShowLobby(false); };

    // 元関数を保存。以下はネットワーク時だけ振る舞いを差し替え、オフライン動作はそのまま。
    const _onlineOrig = {
        startGame: startGame,
        startRound: startRound,
        nextTurn: nextTurn,
        startPlayerTimer: startPlayerTimer,
        triggerMoveToButton: triggerMoveToButton,
        triggerPressButton: triggerPressButton,
        resolveChoice: resolveChoice,
        triggerSuperExplosion: triggerSuperExplosion,
        endGame: endGame
    };

    // 上記オブジェクトは guestStartMatch でも使用するため window 参照にする。
    window._onlineOrig = _onlineOrig;

    startGame = function(){
        if(isOnlineGuest()){
            return _onlineOrig.startGame.call(window);
        }
        if(isOnlineHost()) return _onlineOrig.startGame.call(window);
        return _onlineOrig.startGame.call(window);
    };

    startRound = function(){
        if(isOnlineGuest() && !ONLINE.applying){ return; }
        const r=_onlineOrig.startRound.call(window);
        if(isOnlineHost() && ONLINE.started && survivors.length>1){
            onlineBroadcast({
                type:'roundStart', aliveCount, survivors:[...survivors], deadlySwitchId,
                players:onlineHostSnapshot()
            });
        }
        return r;
    };

    startPlayerTimer = function(){
        const r=_onlineOrig.startPlayerTimer.call(window);
        if(isOnlineHost() && ONLINE.started && activePlayer && !activePlayer.isCPU){
            ONLINE.hostDeadline=Date.now()+PLAYER_TIME_LIMIT*1000;
        }
        return r;
    };

    nextTurn = function(){
        if(isOnlineGuest()) return;
        const r=_onlineOrig.nextTurn.call(window);
        if(isOnlineHost() && ONLINE.started && activePlayer){
            onlineBroadcast({
                type:'turn', playerId:activePlayer.id,
                deadline:(activePlayer.isCPU?0:(ONLINE.hostDeadline||Date.now()+PLAYER_TIME_LIMIT*1000))
            });
        }
        return r;
    };

    triggerMoveToButton = function(sw){
        if(isOnlineGuest()){
            if(!ONLINE.guestReplaying && gameState==='player_wait' && activePlayer && activePlayer.id===ONLINE.localId && sw && !sw.pressed){
                playSound('click'); onlineSend(ONLINE.hostConn,{type:'choose',playerId:ONLINE.localId,switchId:sw.id});
            }
            return;
        }
        const r=_onlineOrig.triggerMoveToButton.call(window,sw);
        if(isOnlineHost() && ONLINE.started && activePlayer && sw){
            onlineBroadcast({type:'choose',playerId:activePlayer.id,switchId:sw.id});
        }
        return r;
    };

    triggerPressButton = function(sw){
        if(isOnlineGuest()){
            if(ONLINE.guestReplaying) return _onlineOrig.triggerPressButton.call(window,sw);
            return;
        }
        return _onlineOrig.triggerPressButton.call(window,sw);
    };

    function onlineHostMakeResult(outcome){
        const preAliveCount=aliveCount;
        const preSurvivors=[...survivors];
        const postSurvivors=outcome==='explode' ? survivors.filter(id=>id!==activePlayer.id) : [...survivors];
        const postAliveCount=outcome==='explode' ? preAliveCount-1 : preAliveCount;
        const payload={
            type:'result', outcome, playerId:activePlayer.id, switchId:activeSwitch?activeSwitch.id:-1,
            rank: outcome==='explode'?preAliveCount:null, preAliveCount, postAliveCount,
            preSurvivors, postSurvivors, pressedCount: outcome==='safe' ? pressedCount+1 : pressedCount,
            deadlySwitchId, players:onlineHostSnapshot()
        };
        if(outcome==='safe') payload.pressedCount=pressedCount+1;
        onlineBroadcast(payload);
    }

    resolveChoice = function(){
        if(isOnlineGuest()) return;
        if(isOnlineHost() && ONLINE.started){
            const outcome=(activeSwitch && activeSwitch.id===deadlySwitchId)?'explode':'safe';
            onlineHostMakeResult(outcome);
            ONLINE.applying=true;
            const r=_onlineOrig.resolveChoice.call(window);
            ONLINE.applying=false;
            return r;
        }
        return _onlineOrig.resolveChoice.call(window);
    };

    triggerSuperExplosion = function(){
        if(isOnlineGuest()){
            if(ONLINE.applying) return _onlineOrig.triggerSuperExplosion.call(window);
            return;
        }
        if(isOnlineHost() && ONLINE.started && !ONLINE.applying){
            // timeout / disconnect など、resolveChoice を経由しない爆発も同期する。
            onlineHostMakeResult('explode');
            ONLINE.applying=true;
            const r=_onlineOrig.triggerSuperExplosion.call(window);
            ONLINE.applying=false;
            return r;
        }
        return _onlineOrig.triggerSuperExplosion.call(window);
    };

    endGame = function(){
        if(isOnlineGuest()) { ONLINE.normalEnd=true; return _onlineOrig.endGame.call(window); }
        if(isOnlineHost() && ONLINE.started && !ONLINE.applying){
            ONLINE.normalEnd=true;
            onlineBroadcast({type:'gameOver',winnerId:survivors[0],survivors:[...survivors],players:onlineHostSnapshot()});
        }
        return _onlineOrig.endGame.call(window);
    };

    // DOM/キーボード用のオンライン起動
    window.startOnlineExplosionBattle = function(){
        onlineOpenChoice();
    };

    // startGame が押された時点ではオンラインロビーではなく通常ゲームなので、
    // 専用ボタンの onclick を上書き。
    document.addEventListener('DOMContentLoaded',function(){
        const btns=document.querySelectorAll('#menu .btn');
        btns.forEach(b=>{
            if((b.textContent||'').includes('オンライン対戦')) b.onclick=function(){startOnlineExplosionBattle();};
        });

        // コレクション側から launchGameOnline で起動された場合にも自動入室。
        if(window._startOnline){
            setTimeout(()=>{
                const action=window._onlineAction||'create'; const code=String(window._joinCode||'').trim().toUpperCase();
                onlineOpenChoice();
                if(action==='join'){
                    onlineChooseJoin();
                    const inp=document.getElementById('online-join-code'); if(inp) inp.value=code;
                    setTimeout(()=>onlineJoinConnect(),120);
                }else{
                    onlineChooseCreate();
                }
            },120);
        }
    });
})();
</script>

<script id="ojwga-role-guard">
(function(){
'use strict';
function cfg(){return window._oijiiMultiConfig||{};}
function participants(){var p=cfg().participants;return Array.isArray(p)?p.slice(0,4):[];}
function applyLocalRoles(){
  try{
    if(cfg().mode!=='local'||typeof players==='undefined'||!Array.isArray(players))return;
    var ps=participants(), used={};
    ps.forEach(function(pp,i){
      var slot=(pp&&pp.slot!=null)?Number(pp.slot):i;
      if(!Number.isInteger(slot)||slot<0||slot>=players.length)slot=i;
      used[slot]=true;
      if(players[slot]){
        players[slot].name=String(pp.name||('プレイヤー'+(slot+1))).slice(0,16);
        players[slot].isCPU=false;
        players[slot].alive=true;
      }
    });
    for(var i=0;i<players.length;i++) if(!used[i]) {players[i].isCPU=true; if(!/^CPU/.test(players[i].name||''))players[i].name='CPU'+(i+1);}
  }catch(e){}
}
function applyOnlineLocalRole(){
  try{
    if(cfg().mode!=='online'||typeof players==='undefined'||!Array.isArray(players)||typeof ONLINE==='undefined')return;
    if(ONLINE.role==='host'&&players[0]) players[0].isCPU=false;
    if(Number.isInteger(ONLINE.localId)&&players[ONLINE.localId]) players[ONLINE.localId].isCPU=false;
  }catch(e){}
}
function guard(){applyLocalRoles();applyOnlineLocalRole();}
window.addEventListener('DOMContentLoaded',function(){setTimeout(guard,50);setTimeout(guard,250);setTimeout(guard,600);});
var tries=0;(function loop(){guard();if(++tries<120)setTimeout(loop,250);})();
})();
</script>
<script>
(function(){
  window.addEventListener('message',function(e){
    var m=e.data||{};
    if(m.type==='mp-shutdown'){
      window.__OIJII_SILENT_CLOSE__=true;
      try{if(typeof ONLINE!=='undefined')ONLINE.normalEnd=true;}catch(_e){}
      try{if(typeof onlineDisconnectAll==='function')onlineDisconnectAll();}catch(_e){}
      return;
    }
    if(m.type!=='mp-result-action'||m.action!=='replay')return;
    try{
      window.__OIJII_SILENT_CLOSE__=false;
      if(typeof ONLINE==='undefined')return;
      if(ONLINE.role==='host'){
        players.forEach(function(p){p.alive=true;p.rank=null;});
        survivors=[0,1,2,3]; aliveCount=4; ONLINE.normalEnd=false; ONLINE.started=false;
        onlineHostStartMatch();
        window.parent.postMessage({type:'mp-result-action-done',action:'replay',gameId:'explosion'},'*');
      }else if(ONLINE.hostConn){
        window.__OIJII_RESULT_REPLAY_REQUESTED__=true;
        onlineSend(ONLINE.hostConn,{type:'replay-request'});
      }
    }catch(err){try{window.parent.postMessage({type:'mp-child-error',message:'再戦の開始に失敗しました。'},'*')}catch(_e){}}
  });
})();
</script>
