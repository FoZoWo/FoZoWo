<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoJeZuブログ — 毎日届けるトレンドノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f6f4ee;
        --paper: #fdfcf9;
        --ink: #201f1a;
        --muted: #7a776c;
        --line: #ddd8c8;
        --accent: #3f6644;
        --accent-ink: #294a2d;
        --accent-soft: #e6ede2;
        --danger: #9a3b34;
        --danger-soft: #f7e9e6;
        --sidebar-bg: #f9f7f1;
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.8;
        margin: 0;
        -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
    }

    header {
        padding: 3rem 1.5rem 2.2rem;
        text-align: center;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
    }

    header .mark {
        display: inline-block;
        width: 34px;
        height: 34px;
        border: 1.5px solid var(--accent);
        border-radius: 50%;
        margin-bottom: 1rem;
        position: relative;
    }
    header .mark::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1.5px solid var(--accent);
        border-radius: 50%;
    }

    header h1 {
        margin: 0;
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 2rem;
        letter-spacing: 0.04em;
    }

    header h1 a {
        text-decoration: none;
        color: var(--ink);
    }

    header h1 a:hover {
        color: var(--accent-ink);
    }

    header p {
        color: var(--muted);
        margin: 0.5rem 0 0;
        font-size: 0.92rem;
    }

    .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 1.5rem;
    }

    .blog-layout {
        display: grid;
        grid-template-columns: 1fr 240px;
        gap: 2.5rem;
        margin-top: 2rem;
        align-items: start;
    }

    @media (max-width: 780px) {
        .blog-layout {
            grid-template-columns: 1fr;
        }
        .sidebar {
            order: -1;
            border-bottom: 1px solid var(--line);
            padding-bottom: 1.5rem;
            margin-bottom: 0.5rem;
        }
    }

    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
    }

    .search-field {
        position: relative;
        flex: 1;
        min-width: 200px;
    }

    .search-field input {
        width: 100%;
        font: inherit;
        font-size: 0.95rem;
        padding: 0.7rem 0.9rem 0.7rem 2.3rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
    }

    .search-field input::placeholder { color: #a6a294; }

    .search-field svg {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        stroke: var(--muted);
        pointer-events: none;
    }

    .result-count {
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
    }

    #loading {
        text-align: center;
        padding: 3rem 0;
        color: var(--muted);
        font-size: 0.9rem;
    }

    .back-link {
        display: inline-block;
        margin: 2rem 0 1.25rem;
        color: var(--accent-ink);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 1px;
    }

    .back-link:hover {
        opacity: 0.85;
    }

    .post-list {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
    }

    .post-row {
        border-bottom: 1px solid var(--line);
    }

    .post-row a {
        display: flex;
        align-items: baseline;
        gap: 1.25rem;
        padding: 1.15rem 0.1rem;
        text-decoration: none;
        transition: padding-left 0.15s ease, background 0.15s ease;
    }

    .post-row a:hover,
    .post-row a:focus-visible {
        padding-left: 0.4rem;
        background: var(--accent-soft);
    }

    .post-row time {
        flex: 0 0 auto;
        font-size: 0.8rem;
        color: var(--muted);
        white-space: nowrap;
        padding-top: 0.2rem;
        min-width: 6.2em;
    }

    .post-row h2 {
        margin: 0;
        font-family: "Shippori Mincho", serif;
        font-weight: 500;
        font-size: 1.08rem;
        line-height: 1.55;
    }

    .post-row mark, .post-title mark {
        background: #fbe7a1;
        color: inherit;
        border-radius: 2px;
        padding: 0 1px;
    }

    @media (max-width: 480px) {
        .post-row a { flex-direction: column; gap: 0.3rem; }
        .post-row time { min-width: auto; }
    }

    .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        margin: 2rem 0 1rem;
        font-size: 0.9rem;
    }

    .pagination button {
        font: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0.5rem 1rem;
        cursor: pointer;
        color: var(--ink);
    }

    .pagination button:hover:not(:disabled) { border-color: var(--accent); }

    .pagination button:disabled {
        opacity: 0.35;
        cursor: default;
    }

    .pagination .page-info { color: var(--muted); }

    .sidebar {
        position: sticky;
        top: 1.5rem;
    }

    .sidebar-section {
        background: var(--sidebar-bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1.2rem 1.1rem;
        margin-bottom: 1.25rem;
    }

    .sidebar-section h3 {
        font-family: "Shippori Mincho", serif;
        font-size: 0.95rem;
        font-weight: 700;
        margin: 0 0 0.85rem;
        color: var(--accent-ink);
        letter-spacing: 0.03em;
    }

    .archive-list {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .archive-list li {
        margin-bottom: 0.35rem;
    }

    .archive-list a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-decoration: none;
        font-size: 0.88rem;
        color: var(--ink);
        padding: 0.25rem 0.35rem;
        border-radius: 4px;
        transition: background 0.15s ease;
    }

    .archive-list a:hover,
    .archive-list a.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
    }

    .archive-list .count {
        font-size: 0.78rem;
        color: var(--muted);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 0.45rem;
        min-width: 1.6em;
        text-align: center;
    }

    .archive-year {
        font-weight: 500;
        margin-top: 0.6rem;
        margin-bottom: 0.25rem;
        font-size: 0.82rem;
        color: var(--muted);
    }

    .archive-year:first-child {
        margin-top: 0;
    }

    article.post-full {
        padding: 0.5rem 0 2rem;
        max-width: 720px;
        margin: 0 auto;
    }

    .post-title {
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 1.7rem;
        line-height: 1.5;
        margin: 0 0 1rem;
    }

    .post-meta {
        display: flex;
        gap: 1.2rem;
        flex-wrap: wrap;
        font-size: 0.82rem;
        color: var(--muted);
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        padding: 0.85rem 0;
        margin-bottom: 2rem;
    }

    .post-content {
        white-space: pre-line;
        font-size: 1.02rem;
        color: #2c2b26;
    }

    .post-content h2, .post-content h3 {
        font-family: "Shippori Mincho", serif;
        color: var(--ink);
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        border-left: 3px solid var(--accent);
        padding-left: 0.7rem;
    }

    .post-content ul, .post-content ol { padding-left: 1.4rem; }
    .post-content li { margin-bottom: 0.35rem; }

    .post-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 2.5rem 0 1rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--line);
    }

    .post-nav a {
        display: block;
        text-decoration: none;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        transition: border-color 0.15s ease, background 0.15s ease;
    }

    .post-nav a:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
    }

    .post-nav .nav-label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 0.3rem;
    }

    .post-nav .nav-title {
        font-family: "Shippori Mincho", serif;
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.4;
        color: var(--ink);
    }

    .post-nav .nav-prev {
        text-align: left;
    }

    .post-nav .nav-next {
        text-align: right;
        grid-column: 2;
    }

    .post-nav .nav-empty {
        visibility: hidden;
    }

    @media (max-width: 520px) {
        .post-nav {
            grid-template-columns: 1fr;
        }
        .post-nav .nav-next {
            grid-column: 1;
            text-align: left;
        }
    }

    .state-block {
        text-align: center;
        padding: 3.5rem 1rem;
        color: var(--muted);
    }

    .state-block h2 {
        font-family: "Shippori Mincho", serif;
        color: var(--ink);
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
        font-weight: 500;
    }

    .error-message {
        background: var(--danger-soft);
        color: var(--danger);
        padding: 1rem 1.2rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-top: 1.5rem;
    }

    footer {
        text-align: center;
        padding: 2.5rem 0 3rem;
        color: var(--muted);
        font-size: 0.82rem;
        border-top: 1px solid var(--line);
        margin-top: 2rem;
    }

    footer a {
        color: var(--accent-ink);
        text-decoration: none;
        border-bottom: 1px solid transparent;
    }

    footer a:hover {
        border-bottom-color: var(--accent);
    }
</style>
</head>
<body>

<header>
    <span class="mark" aria-hidden="true"></span>
    <h1><a href="https://www.zojezu.f5.si/blog">ZoJeZuブログ</a></h1>
    <p>毎日届けるトレンドノート</p>
</header>

<div class="container">
    <div id="loading">記事を読み込んでいます…</div>
    <div id="posts-container"></div>
</div>

<footer>
    <p>© ZoJeZu — <a href="https://www.zojezu.f5.si/blog">ブログトップ</a></p>
</footer>

<script>
    const API_URL = 'https://blog-api.oisasioisasi.workers.dev';
    const BLOG_HOME = 'https://www.zojezu.f5.si/blog';
    const PAGE_SIZE = 10;

    let allPosts = [];
    let currentPage = 1;
    let currentQuery = '';
    let currentArchiveKey = '';

    async function initBlog() {
        const container = document.getElementById('posts-container');
        const loading = document.getElementById('loading');
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`サーバーエラー: ${response.status}`);

            const data = await response.json();
            loading.style.display = 'none';

            if (!data.success) throw new Error('データの取得に失敗しました。');

            allPosts = (data.posts || []).slice().sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );

            if (postId) {
                renderSinglePost(container, postId);
            } else {
                renderListPage(container);
            }
        } catch (error) {
            loading.style.display = 'none';
            container.innerHTML = `<div class="error-message">エラーが発生しました: ${escapeHTML(error.message)}</div>`;
            console.error('Error fetching posts:', error);
        }
    }

    function renderListPage(container) {
        document.title = 'ZoJeZuブログ — 毎日届けるトレンドノート';

        container.innerHTML = `
            <div class="blog-layout">
                <div class="main-col">
                    <div class="toolbar">
                        <div class="search-field">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="7"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input id="search-input" type="text" placeholder="記事を検索（タイトル・本文）" aria-label="記事を検索">
                        </div>
                        <span class="result-count" id="result-count"></span>
                    </div>
                    <div id="list-body"></div>
                </div>
                <aside class="sidebar">
                    <div class="sidebar-section">
                        <h3>アーカイブ</h3>
                        <div id="archive-body"></div>
                    </div>
                </aside>
            </div>
        `;

        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', () => {
            currentQuery = searchInput.value.trim();
            currentPage = 1;
            currentArchiveKey = '';
            renderListBody();
            renderArchive();
        });

        renderListBody();
        renderArchive();
    }

    function getFilteredPosts() {
        let filtered = allPosts;

        if (currentArchiveKey) {
            filtered = filtered.filter(p => {
                const d = new Date(p.created_at);
                const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                return key === currentArchiveKey;
            });
        }

        const q = currentQuery.toLowerCase();
        if (q) {
            filtered = filtered.filter(p =>
                p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q)
            );
        }

        return filtered;
    }

    function renderListBody() {
        const listBody = document.getElementById('list-body');
        const resultCount = document.getElementById('result-count');
        if (!listBody) return;

        const filtered = getFilteredPosts();

        let countText = `全${allPosts.length}件`;
        if (currentArchiveKey || currentQuery) {
            countText = `${filtered.length}件ヒット（全${allPosts.length}件中）`;
            if (currentArchiveKey) {
                const [y, m] = currentArchiveKey.split('-');
                countText = `${y}年${parseInt(m, 10)}月：${filtered.length}件`;
                if (currentQuery) countText += `（検索中）`;
            }
        }
        resultCount.textContent = countText;

        if (filtered.length === 0) {
            listBody.innerHTML = `
                <div class="state-block">
                    <h2>${currentQuery || currentArchiveKey ? '該当する記事が見つかりませんでした' : 'まだ記事がありません'}</h2>
                    <p>${currentQuery || currentArchiveKey ? '条件を変えてもう一度お試しください。' : '最初の記事が自動投稿されるのをお待ちください。'}</p>
                    ${(currentArchiveKey || currentQuery) ? `<p style="margin-top:1rem;"><a href="#" id="clear-filter" style="color:var(--accent-ink);">フィルターをクリア</a></p>` : ''}
                </div>
            `;
            const clearBtn = document.getElementById('clear-filter');
            if (clearBtn) {
                clearBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentQuery = '';
                    currentArchiveKey = '';
                    currentPage = 1;
                    const input = document.getElementById('search-input');
                    if (input) input.value = '';
                    renderListBody();
                    renderArchive();
                });
            }
            return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pagePosts = filtered.slice(start, start + PAGE_SIZE);

        const rows = pagePosts.map(post => `
            <li class="post-row">
                <a href="?id=${post.id}">
                    <time>${formatDateShort(post.created_at)}</time>
                    <h2>${highlight(escapeHTML(post.title), currentQuery)}</h2>
                </a>
            </li>
        `).join('');

        listBody.innerHTML = `
            <ul class="post-list">${rows}</ul>
            ${totalPages > 1 ? `
                <div class="pagination">
                    <button id="prev-page" ${currentPage === 1 ? 'disabled' : ''}>← 前へ</button>
                    <span class="page-info">${currentPage} / ${totalPages}</span>
                    <button id="next-page" ${currentPage === totalPages ? 'disabled' : ''}>次へ →</button>
                </div>
            ` : ''}
        `;

        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        if (prevBtn) prevBtn.addEventListener('click', () => {
            currentPage--;
            renderListBody();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        if (nextBtn) nextBtn.addEventListener('click', () => {
            currentPage++;
            renderListBody();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    function buildArchiveData() {
        const map = new Map();
        allPosts.forEach(p => {
            const d = new Date(p.created_at);
            const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            if (!map.has(key)) map.set(key, 0);
            map.set(key, map.get(key) + 1);
        });
        return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
    }

    function renderArchive() {
        const archiveBody = document.getElementById('archive-body');
        if (!archiveBody) return;

        const entries = buildArchiveData();
        if (entries.length === 0) {
            archiveBody.innerHTML = `<p style="font-size:0.85rem;color:var(--muted);margin:0;">まだ記事がありません</p>`;
            return;
        }

        let html = '<ul class="archive-list">';
        let lastYear = '';
        entries.forEach(([key, count]) => {
            const [y, m] = key.split('-');
            if (y !== lastYear) {
                html += `<li class="archive-year">${y}年</li>`;
                lastYear = y;
            }
            const label = `${parseInt(m, 10)}月`;
            const isActive = currentArchiveKey === key;
            html += `
                <li>
                    <a href="#" data-archive="${key}" class="${isActive ? 'active' : ''}">
                        <span>${label}</span>
                        <span class="count">${count}</span>
                    </a>
                </li>
            `;
        });
        html += '</ul>';

        if (currentArchiveKey) {
            html += `<p style="margin:0.8rem 0 0;font-size:0.82rem;"><a href="#" id="clear-archive" style="color:var(--accent-ink);">すべて表示</a></p>`;
        }

        archiveBody.innerHTML = html;

        archiveBody.querySelectorAll('[data-archive]').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const key = a.getAttribute('data-archive');
                currentArchiveKey = (currentArchiveKey === key) ? '' : key;
                currentPage = 1;
                currentQuery = '';
                const input = document.getElementById('search-input');
                if (input) input.value = '';
                renderListBody();
                renderArchive();
            });
        });

        const clearArchive = document.getElementById('clear-archive');
        if (clearArchive) {
            clearArchive.addEventListener('click', (e) => {
                e.preventDefault();
                currentArchiveKey = '';
                currentPage = 1;
                renderListBody();
                renderArchive();
            });
        }
    }

    function renderSinglePost(container, postId) {
        const idx = allPosts.findIndex(p => String(p.id) === String(postId));
        const post = idx >= 0 ? allPosts[idx] : null;

        if (!post) {
            container.innerHTML = `
                <a href="${BLOG_HOME}" class="back-link">← 記事一覧に戻る</a>
                <div class="state-block">
                    <h2>指定された記事が見つかりませんでした</h2>
                    <p>URLをご確認いただくか、一覧からお探しください。</p>
                </div>
            `;
            return;
        }

        document.title = `${post.title} | ZoJeZu`;
        const minutes = Math.max(1, Math.round(post.content.length / 500));

        // allPosts is newest-first → older = idx+1, newer = idx-1
        const older = idx < allPosts.length - 1 ? allPosts[idx + 1] : null;
        const newer = idx > 0 ? allPosts[idx - 1] : null;

        let navHtml = '<nav class="post-nav" aria-label="前後の記事">';
        if (older) {
            navHtml += `
                <a href="?id=${older.id}" class="nav-prev">
                    <span class="nav-label">← 前の記事</span>
                    <span class="nav-title">${escapeHTML(older.title)}</span>
                </a>
            `;
        } else {
            navHtml += `<div class="nav-empty"></div>`;
        }
        if (newer) {
            navHtml += `
                <a href="?id=${newer.id}" class="nav-next">
                    <span class="nav-label">次の記事 →</span>
                    <span class="nav-title">${escapeHTML(newer.title)}</span>
                </a>
            `;
        }
        navHtml += '</nav>';

        container.innerHTML = `
            <a href="${BLOG_HOME}" class="back-link">← 記事一覧に戻る</a>
            <article class="post-full">
                <h1 class="post-title">${escapeHTML(post.title)}</h1>
                <div class="post-meta">
                    <span>${formatDate(post.created_at)}</span>
                    <span>読了目安 約${minutes}分</span>
                </div>
                <div class="post-content">${formatContent(escapeHTML(post.content))}</div>
                ${navHtml}
            </article>
        `;
    }

    function formatDate(dateString) {
        return new Date(dateString).toLocaleDateString('ja-JP', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }

    function formatDateShort(dateString) {
        return new Date(dateString).toLocaleDateString('ja-JP', {
            year: 'numeric', month: 'numeric', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        }).replace(/(\d+)\/(\d+)\/(\d+)/, '$1/$2/$3');
    }

    function escapeHTML(str) {
        return String(str).replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                "'": '&#39;', '"': '&quot;'
            }[tag] || tag)
        );
    }

    function highlight(escapedText, query) {
        if (!query) return escapedText;
        const safe = escapeHTML(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return escapedText.replace(new RegExp(safe, 'gi'), m => `<mark>${m}</mark>`);
    }

    function formatContent(text) {
        let formatted = text.replace(/\n/g, '<br>');
        formatted = formatted.replace(/^## (.*?)(<br>|$)/gm, '<h2>$1</h2>');
        formatted = formatted.replace(/^### (.*?)(<br>|$)/gm, '<h3>$1</h3>');
        formatted = formatted.replace(/^- (.*?)(<br>|$)/gm, '<ul><li>$1</li></ul>');
        formatted = formatted.replace(/<\/ul><ul>/g, '');
        return formatted;
    }

    document.addEventListener('DOMContentLoaded', initBlog);
</script>
</body>
</html>
