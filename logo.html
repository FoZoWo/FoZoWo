<script>
(function(){
  var r=document.documentElement,t='auto',l='ja';
  try{t=localStorage.getItem('FoZoWo-theme')||'auto';l=localStorage.getItem('FoZoWo-language')||'ja';}catch(e){}
  if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  r.setAttribute('data-theme',t==='light'?'light':'dark');
  r.dataset.siteLang=l;
  r.lang=l==='hiragana'?'ja-JP-x-hiragana':(l==='zh-cn'?'zh-CN':(l==='zh-tw'?'zh-TW':l));
})();
</script>

<style>
:root,[data-theme="dark"]{--bg:#07060f;--panel:#120e22;--line:rgba(178,150,255,.16);--line-strong:rgba(178,150,255,.4);--text:#f3f0ff;--muted:#9d97c6;--pink:#ff5fa8;--violet:#8b6cff;--cyan:#57e8ff;--gold:#ffcf7e;--glass:rgba(255,255,255,.04);--shadow:0 24px 60px rgba(0,0,0,.55);--radius:24px;--header-h:68px}
[data-theme="light"]{--bg:#f4f0ff;--panel:#fff;--line:rgba(90,60,200,.16);--line-strong:rgba(90,60,200,.38);--text:#1c1230;--muted:#645892;--pink:#d63d94;--violet:#6a3fe0;--cyan:#0092b3;--gold:#af7a12;--glass:rgba(90,60,200,.05);--shadow:0 18px 44px rgba(70,40,140,.16)}
@media(prefers-color-scheme:light){[data-theme="auto"]{--bg:#f4f0ff;--panel:#fff;--line:rgba(90,60,200,.16);--line-strong:rgba(90,60,200,.38);--text:#1c1230;--muted:#645892;--pink:#d63d94;--violet:#6a3fe0;--cyan:#0092b3;--gold:#af7a12;--glass:rgba(90,60,200,.05);--shadow:0 18px 44px rgba(70,40,140,.16)}}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;min-height:100dvh;padding-top:var(--header-h);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse 80% 60% at 15% -10%,color-mix(in srgb,var(--violet) 30%,transparent),transparent 55%),radial-gradient(ellipse 70% 50% at 90% 5%,color-mix(in srgb,var(--pink) 24%,transparent),transparent 50%),var(--bg);overflow-x:hidden}
a,button{cursor:pointer}.shell{width:min(900px,calc(100% - 28px));margin:0 auto;padding:44px 0 80px}.hero{text-align:center;padding:10px 0 34px}.badge{display:inline-flex;align-items:center;padding:7px 15px;border-radius:999px;color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 28%,transparent);font-size:11px;font-weight:800;letter-spacing:.12em}.hero h1{margin:18px 0 0;font-family:Cinzel,serif;font-size:clamp(32px,7vw,54px);line-height:1.15}.hero h1 span{background:linear-gradient(120deg,var(--text),var(--pink),var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.section-title{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}.logo-card{padding:clamp(24px,5vw,44px);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);text-align:center}.preview-frame{min-height:300px;display:grid;place-items:center;padding:clamp(18px,5vw,40px);border-radius:20px;background:var(--glass);border:1px solid var(--line)}.brand-img{width:min(100%,440px);height:auto;display:block;filter:drop-shadow(0 12px 35px color-mix(in srgb,var(--pink) 25%,transparent))}.actions{display:flex;justify-content:center;margin-top:22px}.download{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;border-radius:999px;border:1px solid transparent;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;text-decoration:none;font-size:15px;font-weight:800;box-shadow:0 12px 30px color-mix(in srgb,var(--pink) 32%,transparent);transition:.25s}.download:hover{transform:translateY(-3px);background:linear-gradient(135deg,var(--violet),var(--cyan))}.download svg{width:18px;height:18px}footer{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:600px){.shell{padding-top:28px}.logo-card{padding:18px}.preview-frame{min-height:220px}.download{width:100%}}

<body>
<div id="headerRoot"></div>
<div class="shell">
  <header class="hero">
    <div class="badge" data-i18n="badge">LOGO</div>
    <h1><span data-i18n="hero_title">FoZoWoのロゴ</span></h1>
  </header>
  <section>
    <div class="section-title" data-i18n="preview">IMAGE PREVIEW</div>
    <div class="logo-card">
      <div class="preview-frame">
        <img class="brand-img" id="logoImg" src="おいさしロゴ.png" alt="FoZoWoロゴ" data-i18n-alt="alt">
      </div>
      <div class="actions">
        <a class="download" href="おいさしロゴ.png" download="FoZoWo-logo.png">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
          <span data-i18n="btn_download">ロゴをダウンロード</span>
        </a>
      </div>
    </div>
  </section>
  <div style="text-align:center;margin-top:24px">
    <a href="index.html?lang=ja" data-localized-page="home" style="display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--text);text-decoration:none;font-weight:700"><span>←</span><span data-i18n="back">トップに戻る</span></a>
  </div>
  <footer><span data-i18n="footer">FoZoWo Official</span></footer>
</div>
<script>
(function(){
  'use strict';
  var root=document.getElementById('headerRoot');
  fetch('header.html',{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(html){
    var tpl=document.createElement('template');
    tpl.innerHTML=html;
    var scripts=Array.from(tpl.content.querySelectorAll('script'));
    scripts.forEach(function(sc){sc.remove()});
    root.appendChild(tpl.content);
    scripts.forEach(function(old){
      var sc=document.createElement('script');
      Array.from(old.attributes).forEach(function(a){sc.setAttribute(a.name,a.value)});
      sc.textContent=old.textContent;
      root.appendChild(sc);
    });
    if(window.FoZoWoLang){window.FoZoWoLang.refresh();window.FoZoWoLang.refreshHeader();}
  }).catch(function(err){console.warn('[header]',err)});
})();
</script>
</body>
