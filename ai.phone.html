/* ===== Idle / dial screen ===== */

<div id="ai-use-restriction" hidden aria-live="polite">
  <strong id="ai-use-restriction-title">AI利用を一時制限中</strong>
  <span id="ai-use-restriction-text">ブログAIの自動投稿準備のため、8:45〜9:30（日本時間）はAIを利用できません。</span>
  <span class="ai-restriction-time" id="ai-use-restriction-time"></span>
</div>

<script id="ai-use-restriction-script">
(function(){
  const startMin=8*60+45;
  const endMin=9*60+30;
  const notice=document.getElementById('ai-use-restriction');
  const title=document.getElementById('ai-use-restriction-title');
  const text=document.getElementById('ai-use-restriction-text');
  const time=document.getElementById('ai-use-restriction-time');
  function jst(){
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false,hourCycle:'h23'}).formatToParts(new Date());
    const h=Number((parts.find(p=>p.type==='hour')||{}).value||0);
    const m=Number((parts.find(p=>p.type==='minute')||{}).value||0);
    return h*60+m;
  }
  function restricted(){
    const m=jst();
    return m>=startMin && m<endMin;
  }
  function update(){
    const locked=restricted();
    const en=(document.documentElement.lang||'ja').toLowerCase().startsWith('en');
    if(notice){
      notice.hidden=!locked;
      if(locked){
        title.textContent=en?'AI use temporarily limited':'AI利用を一時制限中';
        text.textContent=en
          ?'AI use is paused from 8:45 to 9:30 JST for the daily blog AI run.'
          :'ブログAIの自動投稿準備のため、8:45〜9:30（日本時間）はAIを利用できません。';
        const remain=Math.max(0,endMin-jst());
        const rm=Math.floor(remain/60), rs=remain%60;
        time.textContent=en
          ?`Resumes at 09:30 JST (about ${rm}m ${String(rs).padStart(2,'0')}s remaining)`
          :`9:30（日本時間）に再開します（あと${rm}分${String(rs).padStart(2,'0')}秒）`;
      }else{
        time.textContent='';
      }
    }
    document.dispatchEvent(new CustomEvent('ai-use-restriction-change',{detail:{restricted:locked}}));
  }
  window.__isAIUseRestricted=restricted;
  window.__updateAIUseRestriction=update;
  update();
  setInterval(update,1000);
  document.addEventListener('languagechange',update);
})();
</script>

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function playTone(kind) {
    return new Promise((resolve) => {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) { resolve(); return; }
        const ctx = new Ctx();
        const master = ctx.createGain();
        master.gain.value = kind === 'ring' ? 0.18 : 0.22;
        master.connect(ctx.destination);
        const t0 = ctx.currentTime + 0.05;

        if (kind === 'ring') {

            [400, 450].forEach((freq) => {
              const osc = ctx.createOscillator();
              const g = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.value = freq;
              g.gain.setValueAtTime(0.0001, start);
              g.gain.exponentialRampToValueAtTime(0.55, start + 0.03);
              g.gain.setValueAtTime(0.55, start + dur - 0.05);
              g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
              osc.connect(g); g.connect(master);
              osc.start(start); osc.stop(start + dur + 0.02);
            });
          };
          ring(t0, 1.0);
          ring(t0 + 3.0, 1.0);
          setTimeout(() => { try { ctx.close(); } catch (e) {} resolve(); }, 4500);

            osc.type = 'sine';

            g.gain.exponentialRampToValueAtTime(0.9, start + 0.02);

            osc.connect(g); g.connect(master);

          };
          beep(t0, 0.28);
          beep(t0 + 0.42, 0.28);
          beep(t0 + 0.84, 0.28);
          setTimeout(() => { try { ctx.close(); } catch (e) {} resolve(); }, 1400);
        }
      } catch (e) {
        resolve();
      }
    });
  }

  function isGoodbyeMessage(text) {
    const raw = text || '';
    if (/(またね|じゃあね|じゃーね|バイバイ|ばいばい|さようなら|さよなら|失礼します|おやすみ|see\s*you|good\s*bye|\bbye\b|通話終了|電話切|終わり|終了)/i.test(raw)) {
      return true;
    }
    const n = raw.toLowerCase().replace(/\s+/g, '').replace(/[！!。．.？?、,ー～]/g, '');
    const patterns = ['またね','じゃあね','じゃね','バイバイ','ばいばい','bye','goodbye','seeyou','さようなら','さよなら','失礼します','おやすみ','また今度','ではまた','通話終了'];
    return patterns.some(p => n === p || n.indexOf(p) !== -1);
  }

  async function askAI(userText) {
    if (window.__isAIUseRestricted && window.__isAIUseRestricted()) {
      setPhoneState('thinking', isJa() ? 'AI利用は9:30まで制限中です' : 'AI use is limited until 09:30 JST', isJa() ? 'ブログAIの自動投稿準備のため一時停止しています。' : 'Temporarily paused for the daily blog AI run.');
      return null;
    }
    isSending = true;
    conversationMessages.push({ role: 'user', content: userText });
    try {
      const nowJst = new Date().toLocaleString('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const msgs = conversationMessages.map((m, idx) => {
        if (idx === 0 && m.role === 'system') {
          return {
            role: 'system',
            content: m.content + '\n\n【現在の日時（日本時間）】' + nowJst
          };
        }
        return { role: m.role, content: m.content };
      });
      const response = await fetch(API_SERVER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: msgs })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || response.statusText);
      const reply = data.choices[0].message.content;
      conversationMessages.push({ role: 'assistant', content: reply });
      return reply;
    } catch (e) {
      conversationMessages.pop();
      return null;
    } finally {
      isSending = false;
    }
  }

  function stopRecognition() {
    try {
      if (talkRec) {
        talkRec.onend = null;
        talkRec.stop();
      }
    } catch (e) {}
    talkRec = null;
  }

  function endCall() {
    talkActive = false;
    talkBusy = false;
    stopRecognition();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setPhoneState(null, isJa() ? '通話終了' : 'Call ended', '');
    playTone('busy').then(() => {
      setCallUI(false);
      // 通話は履歴に残さない
      conversationMessages = [{ role: 'system', content: SYSTEM_PROMPT }];
    });
  }

  async function openingGreeting() {
    const hour = Number(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo', hour: 'numeric', hour12: false }));
    let greet;
    if (isJa()) {
      if (hour >= 5 && hour < 11) greet = 'お電話ありがとうございます。フォゾウォAIです。おはようございます。ご用件をお話しください。';
      else if (hour >= 18 || hour < 5) greet = 'お電話ありがとうございます。フォゾウォAIです。こんばんは。ご用件をお話しください。';
      else greet = 'お電話ありがとうございます。フォゾウォAIです。こんにちは。ご用件をお話しください。';
    } else {
      greet = 'Thank you for calling. This is FoZoWo AI. How can I help you?';
    }
    setPhoneState('speaking', isJa() ? '話しています…' : 'Speaking…', greet);
    speak(greet);
    await waitSpeechEnd();
  }

  function listenOnce() {
    if (!talkActive || talkBusy || isSending) return;
    stopRecognition();
    setPhoneState('listening', isJa() ? '聞いています…' : 'Listening…', '');

    const rec = new SpeechRecognition();
    talkRec = rec;
    rec.lang = getLang();
    rec.interimResults = false;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    rec.onresult = async (event) => {
      let said = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) said += event.results[i][0].transcript;
      }
      said = (said || '').trim();
      if (!said || !talkActive) return;

      const shouldHangUp = isGoodbyeMessage(said);
      talkBusy = true;
      setPhoneState('thinking', isJa() ? '考えています…' : 'Thinking…', said);

      let sendText = said;
      if (shouldHangUp) {
        sendText = said + (isJa()
          ? '（これは通話の終了の挨拶です。短く温かく返事をしてください。）'
          : ' (This is a farewell to end the call. Reply briefly.)');
      }

      const reply = await askAI(sendText);
      if (!talkActive) { talkBusy = false; return; }

      if (reply) {
        setPhoneState('speaking', isJa() ? '話しています…' : 'Speaking…', reply);
        speak(reply);
        await waitSpeechEnd();
        talkBusy = false;
        if (!talkActive) return;
        if (shouldHangUp) endCall();
        else listenOnce();
      } else {
        talkBusy = false;
        if (!talkActive) return;
        if (shouldHangUp) { endCall(); return; }
        setPhoneState('listening', isJa() ? 'もう一度話してください' : 'Please try again', '');
        setTimeout(() => { if (talkActive) listenOnce(); }, 800);
      }
    };

    rec.onerror = (ev) => {
      if (!talkActive) return;
      if (ev.error === 'not-allowed') {
        alert(isJa() ? 'マイクの使用が許可されていません。' : 'Microphone access denied.');
        endCall();
        return;
      }
      if (!talkBusy) {
        setTimeout(() => { if (talkActive && !talkBusy) listenOnce(); }, 400);
      }
    };

    rec.onend = () => {
      if (talkActive && !talkBusy) {
        setTimeout(() => { if (talkActive && !talkBusy) listenOnce(); }, 300);
      }
    };

    try { rec.start(); }
    catch (e) { setTimeout(() => { if (talkActive && !talkBusy) listenOnce(); }, 500); }
  }

  async function startCall() {
    if (talkActive || !SpeechRecognition) return;
    if (window.__isAIUseRestricted && window.__isAIUseRestricted()) {
      setPhoneState(null, isJa() ? '9:30まで利用できません' : 'Unavailable until 09:30 JST', '');
      return;
    }
    conversationMessages = [{ role: 'system', content: SYSTEM_PROMPT }];
    setCallUI(true);
    talkBusy = true;
    setPhoneState('calling', isJa() ? '発信中…' : 'Calling…', '');
    await playTone('ring');
    if (!talkActive) { talkBusy = false; return; }
    await openingGreeting();
    if (!talkActive) { talkBusy = false; return; }
    talkBusy = false;
    listenOnce();
  }

  document.addEventListener('ai-use-restriction-change', function(e){
    const locked=!!e.detail?.restricted;
    startCallBtn.disabled=locked || !SpeechRecognition;
    if (locked && talkActive) { try { endCall(); } catch(e) {} }
  });
  startCallBtn.disabled=(window.__isAIUseRestricted&&window.__isAIUseRestricted()) || !SpeechRecognition;
  startCallBtn.addEventListener('click', startCall);
  endCallBtn.addEventListener('click', endCall);
})();
</script>
